<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wochenstapel</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: eine schmale Spalte wie ein Stapel Karteikarten, PAGS-Kopf oben, Entwickler-Fußzeile unten */
:root{
  --bg:#F2F2F0; --card:#FFFFFF; --ink:#2B2B2C; --mute:#77777A; --line:#DCDCDA; --chip:#E8E8E6;
  --accent:#AD120D; --accent-ink:#FFFFFF; --done:#A9A9A7; --scrim:rgba(24,24,26,.4);
  --danger:#AD120D; --shadow:0 12px 32px rgba(20,20,22,.18); --logo-bg:#FFFFFF;
  --f-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161618; --card:#212124; --ink:#ECECEE; --mute:#8E8E93; --line:#2E2E32; --chip:#29292D;
  --accent:#E24A40; --accent-ink:#1A0605; --done:#5C5C61; --scrim:rgba(0,0,0,.6);
  --danger:#FF6B61; --shadow:0 12px 32px rgba(0,0,0,.55); --logo-bg:#F4F4F2; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161618; --card:#212124; --ink:#ECECEE; --mute:#8E8E93; --line:#2E2E32; --chip:#29292D;
  --accent:#E24A40; --accent-ink:#1A0605; --done:#5C5C61; --scrim:rgba(0,0,0,.6);
  --danger:#FF6B61; --shadow:0 12px 32px rgba(0,0,0,.55); --logo-bg:#F4F4F2; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}

/* Kopf */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px}
.logo{display:block;background:var(--logo-bg);border-radius:10px;padding:8px 12px;line-height:0}
.logo img{height:52px;width:auto}
.iconbtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--mute)}
.iconbtn:hover,.iconbtn:active{background:var(--chip)}
.intro{padding-block:18px 0}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
h1{margin:6px 0 0;font-family:var(--f-display);font-size:36px;line-height:1;font-weight:900;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.dots{margin-top:14px;height:6px;position:relative}
.dots::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--line) 2px,transparent 2.4px) 0 50%/10px 6px repeat-x}
.dots i{position:absolute;inset:0 auto 0 0;width:0;background:radial-gradient(circle,var(--accent) 2px,transparent 2.4px) 0 50%/10px 6px repeat-x;transition:width .4s ease}

/* Tage */
.day{padding-block:24px 2px}
.dhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.dhead h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:800;text-transform:uppercase}
.day.today .dhead h2{font-size:28px;font-weight:900;color:var(--accent)}
.day.weekend .dhead h2{color:var(--mute)}
.ddate{font-size:14px;color:var(--mute);font-weight:600}
.count{margin-left:auto;font-size:14px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0;min-height:6px;display:flex;flex-direction:column;gap:6px}

.task{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;background:var(--card);border-radius:12px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:opacity .2s}
.check{flex:none;width:24px;height:24px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--accent)}
.check svg{opacity:0;transform:scale(.5);transition:all .18s}
.txt{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:1px}
.meta{display:flex;gap:6px;align-items:center;flex:none;padding-top:3px}
.tag{font-size:12px;font-weight:700;color:var(--mute);background:var(--chip);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tag.carry{color:var(--accent)}
.task.done .txt{color:var(--done);text-decoration:line-through}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .check svg{opacity:1;transform:scale(1)}
.task.pop .check{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.add{margin-top:4px}
.addbtn{width:100%;text-align:left;padding:9px 12px;color:var(--mute);font-weight:600;border-radius:12px}
.addbtn:hover,.addbtn:active{background:var(--chip)}
.addin{width:100%;padding:11px 12px;border:2px solid var(--accent);border-radius:12px;background:var(--card);outline:none}

/* Ziehen */
.placeholder{opacity:.25}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:var(--shadow);transform:scale(1.03) rotate(-1deg)}
body.dragging{overflow:hidden}

/* Fußzeile */
.foot{margin-top:48px;padding-block:20px 40px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.foot strong{color:var(--ink);font-weight:700}
.foot a{color:inherit}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:600px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(calc(100% + 60px));visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;
  max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.sheet.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet textarea{width:100%;border:0;background:var(--card);border-radius:12px;padding:14px;resize:none;outline:none;font-size:18px;font-weight:600;min-height:56px}
.label{font-family:var(--f-display);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;padding:9px 13px;border-radius:10px;background:var(--chip);font-size:15px;font-weight:600;overflow:hidden}
.chip.on{background:var(--ink);color:var(--bg)}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink)}
.row{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;padding:14px;border-radius:12px;font-weight:700;background:var(--chip);text-align:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{color:var(--danger)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:var(--card);border-radius:12px;margin-top:8px;width:100%;text-align:left;font-weight:600}
.setting small{display:block;font-weight:400;color:var(--mute);font-size:14px;margin-top:2px}
.switch{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--card);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.backup{width:100%;min-height:90px;margin-top:8px;border:2px dashed var(--line);border-radius:12px;background:var(--card);padding:12px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;outline:none}
.backup:focus{border-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;z-index:80;transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{color:var(--accent);font-weight:800;margin-left:12px;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Anmeldung & Konto */
.status{font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.status.warn{color:var(--accent)}
.headright{display:flex;align-items:center;gap:4px}
.login{max-width:400px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:34px}
.login .lead{margin:0;color:var(--mute)}
.lseg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.lseg button{flex:1;padding:10px 4px;border-radius:8px;font-weight:700;color:var(--mute)}
.lseg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input{padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);outline:none;font-size:17px}
.field input:focus{border-color:var(--accent)}
.note-s{font-size:14px;color:var(--mute);margin:0}
.lmsg{min-height:1.4em;margin:0;font-weight:600;color:var(--accent)}
.bigbtn{padding:14px;border-radius:12px;font-weight:800;background:var(--ink);color:var(--bg);font-size:17px}
.bigbtn:disabled{opacity:.6}
.acct{padding:14px;background:var(--card);border-radius:12px;display:flex;flex-direction:column;gap:2px}
.acct b{font-size:18px}
.pwbox{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.lform{display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}
</style>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DAY=['So','Mo','Di','Mi','Do','Fr','Sa'];
const DAYL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
const CHECK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const REP={none:'Nie',daily:'Täglich',weekdays:'Mo–Fr',weekly:'Wöchentlich'};
const KEY='pags-wochenstapel';
const TABLE='wochenstapel';
const LOGIN_DOMAIN='lernplaner.pags-kuelsheim.de'; // gleiche Konten wie der PAGS Lernplaner; es werden keine Mails verschickt
const CFG=window.LERNPLANER_CONFIG||{};

const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const todayKey=()=>key(new Date());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
const short=k=>{const d=parse(k);return DAY[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]};
function haptic(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};

/* ---------- Daten & Synchronisierung ---------- */
let state=null, today=todayKey();
let CLOUD=null, USER=null, pushT=null;
const storeKey=()=>USER?KEY+':'+USER.id:KEY;
function seed(){
  const t=todayKey();
  return {v:1,settings:{hideDone:false},tasks:[
    {id:uid(),text:'Beispiel: Tippe auf den Kreis, um abzuhaken',date:t,order:0,done:false,repeat:'none'},
    {id:uid(),text:'Beispiel: Tippe auf eine Aufgabe, um sie zu bearbeiten oder zu verschieben',date:t,order:1,done:false,repeat:'none'},
    {id:uid(),text:'Beispiel: Lange drücken und ziehen, um umzusortieren',date:t,order:2,done:false,repeat:'none'},
    {id:uid(),text:'Beispiel: Hausaufgaben für Montag erledigen',date:addDays(t,(7-parse(t).getDay())%7||7),order:0,done:false,repeat:'weekly'}
  ]};
}
function fix(d){if(!d||!Array.isArray(d.tasks))return null;d.settings=Object.assign({hideDone:false},d.settings||{});return d}
function loadLocal(){try{return fix(JSON.parse(lsGet(storeKey())))}catch(e){return null}}
function setSync(s){
  const el=$('#sync');if(!el)return;
  const txt={ok:'✓ gespeichert',saving:'speichert …',offline:'offline',auth:'neu anmelden',local:''}[s]||'';
  el.textContent=txt;el.classList.toggle('warn',s==='offline'||s==='auth');
}
function save(){
  state._savedAt=Date.now();lsSet(storeKey(),JSON.stringify(state));
  if(USER&&CLOUD){lsSet(storeKey()+':dirty','1');setSync(navigator.onLine===false?'offline':'saving');clearTimeout(pushT);pushT=setTimeout(push,1000)}
}
async function push(){
  clearTimeout(pushT);
  if(!USER||!CLOUD||!state)return;
  if(navigator.onLine===false){setSync('offline');return}
  try{
    const {error}=await CLOUD.from(TABLE).upsert({user_id:USER.id,data:state,updated_at:new Date().toISOString()});
    if(error){setSync(error.status===401||/JWT/i.test(error.message||'')?'auth':'offline');return}
    lsDel(storeKey()+':dirty');setSync('ok');
  }catch(e){setSync('offline')}
}
async function pull(){
  if(!USER||!CLOUD||lsGet(storeKey()+':dirty'))return;
  try{
    const {data,error}=await CLOUD.from(TABLE).select('data,updated_at').eq('user_id',USER.id).maybeSingle();
    if(error||!data)return;
    if(new Date(data.updated_at).getTime()>(state._savedAt||0)+1500&&!sheet.classList.contains('on')&&!adding&&!drag){
      const d=fix(data.data);if(!d)return;state=d;lsSet(storeKey(),JSON.stringify(state));normalize();render();toast('Neuester Stand geladen');
    }
    setSync('ok');
  }catch(e){}
}
const find=id=>state.tasks.find(t=>t.id===id);

function normalize(){
  today=todayKey();
  const before=JSON.stringify(state.tasks);
  state.tasks=state.tasks.filter(t=>!(t.done&&t.date&&t.date<today));
  const minOrder=Math.min(0,...state.tasks.filter(t=>t.date===today).map(t=>t.order));
  let i=0;
  state.tasks.filter(t=>!t.done&&t.date&&t.date<today).sort((a,b)=>a.date<b.date?-1:1).forEach(t=>{t.date=today;t.carried=true;t.order=minOrder-100+(i++)});
  if(JSON.stringify(state.tasks)!==before)save();
}
function bucketOf(t){if(!t.date)return 'someday';if(t.date>addDays(today,6))return 'later';return t.date}
function maxOrder(bucket,except){const os=state.tasks.filter(t=>t!==except&&bucketOf(t)===bucket).map(t=>t.order);return os.length?Math.max(...os):-1}
function nextDate(t){
  const base=t.date&&t.date>today?t.date:today;
  if(t.repeat==='daily')return addDays(base,1);
  if(t.repeat==='weekly'){let n=addDays(t.date||today,7);while(n<=today)n=addDays(n,7);return n}
  if(t.repeat==='weekdays'){let n=addDays(base,1);while([0,6].includes(parse(n).getDay()))n=addDays(n,1);return n}
  return null;
}
function addTask(bucket,text){
  const date=bucket==='someday'?null:bucket==='later'?addDays(today,7):bucket;
  state.tasks.push({id:uid(),text,date,order:maxOrder(bucket)+1,done:false,repeat:'none'});save();
}
function toggle(id){
  const t=find(id);if(!t)return;t.done=!t.done;
  if(t.done){
    t.doneAt=Date.now();
    if(t.repeat&&t.repeat!=='none'&&!t.spawned){
      const n={id:uid(),text:t.text,date:nextDate(t),done:false,repeat:t.repeat};
      n.order=maxOrder(bucketOf(n))+1;state.tasks.push(n);t.spawned=n.id;
    }
  }else{
    delete t.doneAt;
    if(t.spawned){const s=find(t.spawned);if(s&&!s.done)state.tasks=state.tasks.filter(x=>x!==s);delete t.spawned}
  }
  save();
}
function moveTo(id,date){const t=find(id);if(!t)return;t.date=date;t.carried=false;t.order=maxOrder(bucketOf(t),t)+1;save()}
function remove(id){
  const t=find(id);if(!t)return;const idx=state.tasks.indexOf(t);
  state.tasks.splice(idx,1);save();render();
  toast('Aufgabe gelöscht','Rückgängig',()=>{state.tasks.splice(idx,0,t);save();render()});
}

/* ---------- Darstellung ---------- */
const stack=$('#stack');
function sections(){
  const s=[];
  for(let i=0;i<7;i++){const k=addDays(today,i),w=parse(k).getDay();
    s.push({key:k,title:i===0?'Heute':i===1?'Morgen':DAYL[w],sub:short(k),today:i===0,weekend:i>1&&(w===0||w===6)})}
  if(state.tasks.some(t=>bucketOf(t)==='later'))s.push({key:'later',title:'Demnächst',sub:'ab '+short(addDays(today,7))});
  s.push({key:'someday',title:'Irgendwann',sub:'ohne Datum'});
  return s;
}
function tasksOf(bucket){
  const list=state.tasks.filter(t=>bucketOf(t)===bucket);
  const open=list.filter(t=>!t.done).sort((a,b)=>bucket==='later'&&a.date!==b.date?(a.date<b.date?-1:1):a.order-b.order);
  const done=list.filter(t=>t.done).sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
  return {open,done,all:open.concat(state.settings.hideDone?[]:done)};
}
function taskHTML(t,bucket){
  const tags=[];
  if(bucket==='later')tags.push('<span class="tag">'+short(t.date)+'</span>');
  if(t.carried&&!t.done)tags.push('<span class="tag carry">übernommen</span>');
  if(t.repeat&&t.repeat!=='none')tags.push('<span class="tag" title="'+REP[t.repeat]+'">↻</span>');
  return '<li class="task'+(t.done?' done':'')+'" data-id="'+t.id+'"><button class="check" aria-label="'+(t.done?'Wieder öffnen':'Abhaken')+'">'+CHECK+'</button>'
    +'<span class="txt">'+esc(t.text)+'</span>'+(tags.length?'<span class="meta">'+tags.join('')+'</span>':'')+'</li>';
}
function render(){
  if(!state)return;
  let html='',total=0,done=0;
  for(const s of sections()){
    const {open,done:dn,all}=tasksOf(s.key),n=open.length+dn.length;
    if(s.key!=='someday'&&s.key!=='later'){total+=n;done+=dn.length}
    html+='<section class="day'+(s.today?' today':'')+(s.weekend?' weekend':'')+'" data-key="'+s.key+'">'
      +'<div class="dhead"><h2>'+s.title+'</h2><span class="ddate">'+s.sub+'</span>'+(n?'<span class="count">'+dn.length+'/'+n+'</span>':'')+'</div>'
      +'<ul class="list" data-key="'+s.key+'">'+all.map(t=>taskHTML(t,s.key)).join('')+'</ul>'
      +'<div class="add"><button class="addbtn" data-key="'+s.key+'">+ Aufgabe</button></div></section>';
  }
  stack.innerHTML=html;
  $('#eyebrow').textContent='KW '+isoWeek(parse(today))+' · '+(total?done+' von '+total+' erledigt':'Alles frei');
  $('#meter').style.width=total?(Math.round(done/total*50)*2)+'%':'0';
}

/* ---------- Hinzufügen ---------- */
let adding=null;
function startAdd(bucket){
  closeAdd(false);
  const box=stack.querySelector('section[data-key="'+bucket+'"] .add');if(!box)return;
  box.innerHTML='<input class="addin" id="addin-'+bucket+'" placeholder="Neue Aufgabe" enterkeyhint="enter" autocomplete="off" aria-label="Neue Aufgabe">';
  const inp=box.firstChild;adding={bucket,inp};inp.focus();
  inp.addEventListener('keydown',e=>{
    if(e.key==='Escape'){inp.value='';closeAdd(false);return}
    if(e.key==='Enter'){e.preventDefault();const v=inp.value.trim();if(v){addTask(bucket,v);adding=null;render();startAdd(bucket)}else closeAdd(true)}
  });
  inp.addEventListener('blur',()=>setTimeout(()=>{if(adding&&adding.inp===inp)closeAdd(true)},120));
}
function closeAdd(commit){if(!adding)return;const {bucket,inp}=adding;adding=null;const v=inp.value.trim();if(commit&&v)addTask(bucket,v);render()}

/* ---------- Klicks ---------- */
let suppress=false;
stack.addEventListener('click',e=>{
  if(suppress)return;
  const add=e.target.closest('.addbtn');if(add){startAdd(add.dataset.key);return}
  const li=e.target.closest('li.task');if(!li)return;const id=li.dataset.id;
  if(e.target.closest('.check')){const t=find(id);li.classList.toggle('done',!t.done);li.classList.add('pop');if(!t.done)haptic();toggle(id);setTimeout(render,320);return}
  openTask(id);
});

/* ---------- Ziehen (Finger und Maus) ---------- */
let lp=null,drag=null;
stack.addEventListener('pointerdown',e=>{
  if(drag||!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;
  const li=e.target.closest('li.task');if(!li||e.target.closest('.check')||li.classList.contains('done'))return;
  lp={li,x:e.clientX,y:e.clientY};
  lp.timer=setTimeout(()=>{if(lp)beginDrag(lp.li,lp.x,lp.y)},e.pointerType==='mouse'?220:380);
});
window.addEventListener('pointermove',e=>{
  if(drag){moveDrag(e.clientX,e.clientY);return}
  if(lp&&(Math.abs(e.clientX-lp.x)>8||Math.abs(e.clientY-lp.y)>8)){clearTimeout(lp.timer);lp=null}
});
stack.addEventListener('touchmove',e=>{if(drag)e.preventDefault()},{passive:false});
function cancelLp(){if(lp){clearTimeout(lp.timer);lp=null}}
window.addEventListener('pointerup',()=>{cancelLp();if(drag)endDrag()});
window.addEventListener('pointercancel',()=>{cancelLp();if(drag)endDrag()});
stack.addEventListener('contextmenu',e=>{if(e.target.closest('li.task'))e.preventDefault()});

function beginDrag(li,x,y){
  lp=null;const r=li.getBoundingClientRect();
  const g=li.cloneNode(true);g.classList.add('ghost');g.style.left=r.left+'px';g.style.top=r.top+'px';g.style.width=r.width+'px';
  document.body.appendChild(g);li.classList.add('placeholder');
  drag={li,g,off:y-r.top,x,y,raf:0};document.body.classList.add('dragging');haptic();
  const loop=()=>{if(!drag)return;const edge=90,h=innerHeight;let v=0;
    if(drag.y<edge)v=-Math.ceil((edge-drag.y)/6);else if(drag.y>h-edge)v=Math.ceil((drag.y-(h-edge))/6);
    if(v){window.scrollBy(0,v);place(drag.x,drag.y)}drag.raf=requestAnimationFrame(loop)};
  drag.raf=requestAnimationFrame(loop);
}
function moveDrag(x,y){drag.x=x;drag.y=y;drag.g.style.top=(y-drag.off)+'px';place(x,y)}
function place(x,y){
  const el=document.elementFromPoint(Math.max(1,Math.min(innerWidth-2,x)),y);if(!el)return;
  const over=el.closest('li.task');
  if(over&&over!==drag.li&&stack.contains(over)){
    if(over.classList.contains('done')){const ul=over.parentNode;ul.insertBefore(drag.li,ul.querySelector('li.done'));return}
    const r=over.getBoundingClientRect();if(y<r.top+r.height/2)over.before(drag.li);else over.after(drag.li);return;
  }
  const sec=el.closest('section.day');
  if(sec){const ul=sec.querySelector('ul.list');if(drag.li.parentNode!==ul)ul.insertBefore(drag.li,ul.querySelector('li.done'))}
}
function endDrag(){
  const {li,g}=drag;cancelAnimationFrame(drag.raf);drag=null;
  g.remove();li.classList.remove('placeholder');document.body.classList.remove('dragging');
  const ul=li.parentNode,bucket=ul.dataset.key,t=find(li.dataset.id);
  if(t){
    if(bucket==='someday')t.date=null;
    else if(bucket==='later'){if(bucketOf(t)!=='later')t.date=addDays(today,7)}
    else t.date=bucket;
    t.carried=false;
    [...ul.querySelectorAll('li.task:not(.done)')].forEach((n,i)=>{const x=find(n.dataset.id);if(x)x.order=i});
    save();
  }
  suppress=true;setTimeout(()=>suppress=false,400);render();
}

/* ---------- Sheet ---------- */
const sheet=$('#sheet'),scrim=$('#scrim');let sheetClose=null,sheetLocked=false;
function openSheet(html,onClose,locked){sheet.innerHTML='<div class="grab"></div>'+html;sheetClose=onClose||null;sheetLocked=!!locked;scrim.classList.add('on');requestAnimationFrame(()=>sheet.classList.add('on'))}
function closeSheet(force){
  if(!sheet.classList.contains('on')||(sheetLocked&&force!==true))return;
  sheet.classList.remove('on');scrim.classList.remove('on');sheetLocked=false;
  const f=sheetClose;sheetClose=null;if(f)f();
  if(document.activeElement)document.activeElement.blur();render();
}
scrim.addEventListener('click',()=>closeSheet());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('on'))closeSheet()});

function openTask(id){
  const t=find(id);if(!t)return;let chips='';
  for(let i=0;i<7;i++){const k=addDays(today,i),d=parse(k);
    chips+='<button class="chip'+(t.date===k?' on':'')+'" data-move="'+k+'">'+(i===0?'Heute':i===1?'Morgen':DAY[d.getDay()]+' '+d.getDate()+'.')+'</button>'}
  const other=t.date&&t.date>addDays(today,6);
  chips+='<button class="chip'+(!t.date?' on':'')+'" data-move="">Irgendwann</button>';
  chips+='<label class="chip'+(other?' on':'')+'">'+(other?short(t.date):'Datum …')+'<input type="date" id="sdate" min="'+today+'" value="'+(t.date||'')+'" aria-label="Datum wählen"></label>';
  let seg='';for(const r in REP)seg+='<button data-rep="'+r+'" class="'+((t.repeat||'none')===r?'on':'')+'">'+REP[r]+'</button>';
  openSheet('<textarea id="stext" rows="2" enterkeyhint="done" aria-label="Aufgabe">'+esc(t.text)+'</textarea>'
    +'<div class="label">Verschieben</div><div class="chips">'+chips+'</div>'
    +'<div class="label">Wiederholen</div><div class="seg">'+seg+'</div>'
    +'<div class="row"><button class="btn danger" id="sdel">Löschen</button><button class="btn primary" id="sok">Fertig</button></div>',
    ()=>{const x=find(id);if(x&&!x.text.trim()){state.tasks=state.tasks.filter(y=>y!==x);save()}});
  const ta=$('#stext');const grow=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'};grow();
  ta.addEventListener('input',()=>{t.text=ta.value.replace(/\n/g,' ');save();grow()});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ta.blur()}});
  sheet.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{moveTo(id,b.dataset.move||null);closeSheet()});
  $('#sdate').addEventListener('change',e=>{if(e.target.value){moveTo(id,e.target.value);closeSheet()}});
  sheet.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>{t.repeat=b.dataset.rep;save();sheet.querySelectorAll('[data-rep]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#sdel').onclick=()=>{closeSheet();remove(id)};
  $('#sok').onclick=()=>closeSheet();
}

function openSettings(){
  const acct=USER?'<div class="label" style="margin-top:0">Konto</div>'
    +'<div class="acct"><span class="note-s">Angemeldet als</span><b>'+esc(USER.name)+'</b></div>'
    +'<button class="setting" id="optPw"><span>Passwort ändern<small>Gilt auch für den PAGS Lernplaner</small></span></button>'
    +'<div class="pwbox" id="pwbox" hidden><div class="field"><label for="np1">Neues Passwort</label><input id="np1" type="password" autocomplete="new-password"></div>'
    +'<div class="field"><label for="np2">Wiederholen</label><input id="np2" type="password" autocomplete="new-password"></div>'
    +'<p class="lmsg" id="npm" role="alert"></p><button class="bigbtn" id="npgo">Passwort speichern</button></div>'
    +'<button class="setting" id="optOut"><span>Abmelden<small>Deine Aufgaben bleiben gespeichert</small></span></button>':'';
  openSheet(acct
    +'<div class="label"'+(USER?'':' style="margin-top:0"')+'>Einstellungen</div>'
    +'<button class="setting" id="optHide"><span>Erledigte ausblenden<small>Abgehakte Aufgaben verschwinden sofort</small></span><span class="switch'+(state.settings.hideDone?' on':'')+'"></span></button>'
    +'<button class="setting" id="optClear"><span>Erledigte jetzt entfernen<small>Räumt alle abgehakten Aufgaben weg</small></span></button>');
  $('#optHide').onclick=()=>{state.settings.hideDone=!state.settings.hideDone;save();$('#optHide .switch').classList.toggle('on',state.settings.hideDone);render()};
  $('#optClear').onclick=()=>{const n=state.tasks.filter(t=>t.done).length;state.tasks=state.tasks.filter(t=>!t.done);save();closeSheet();toast(n?n+' erledigte entfernt':'Nichts zu entfernen')};
  if(USER){
    $('#optPw').onclick=()=>{$('#pwbox').hidden=!$('#pwbox').hidden;if(!$('#pwbox').hidden)$('#np1').focus()};
    $('#npgo').onclick=async()=>{const a=$('#np1').value,b=$('#np2').value,m=$('#npm');
      if(a.length<8){m.textContent='Mindestens 8 Zeichen.';return}if(a!==b){m.textContent='Die Passwörter sind nicht gleich.';return}
      $('#npgo').disabled=true;const {error}=await CLOUD.auth.updateUser({password:a});
      if(error){$('#npgo').disabled=false;m.textContent=authMsg(error);return}
      closeSheet();toast('Passwort geändert')};
    $('#optOut').onclick=()=>{closeSheet();logout()};
  }
}
$('#menu').onclick=()=>{if(state)openSettings()};

/* ---------- Toast ---------- */
let tt=0;
function toast(msg,action,fn){
  const el=$('#toast');clearTimeout(tt);
  el.innerHTML=esc(msg)+(action?'<button>'+action+'</button>':'');
  if(action)el.querySelector('button').onclick=()=>{el.classList.remove('on');fn()};
  el.classList.add('on');tt=setTimeout(()=>el.classList.remove('on'),action?4500:2600);
}

/* ---------- Anmeldung ---------- */
const toLogin=u=>u+'@'+LOGIN_DOMAIN;
const USER_RE=/^[a-z0-9][a-z0-9._-]{2,29}$/;
function authMsg(e){const m=(e&&e.message)||'';
  if(/Invalid login credentials/i.test(m))return 'Benutzername oder Passwort stimmt nicht.';
  if(/already registered|already exists/i.test(m))return 'Diesen Benutzernamen gibt es schon. Wähle bitte einen anderen.';
  if(/Password should be|weak/i.test(m))return 'Das Passwort ist zu kurz oder zu einfach.';
  if(/Signups not allowed|signup.*disabled/i.test(m))return 'Neue Konten können gerade nicht angelegt werden.';
  if(/rate limit|too many/i.test(m))return 'Zu viele Versuche. Warte kurz und probier es noch einmal.';
  if(/fetch|network|Failed/i.test(m))return 'Keine Verbindung zum Server. Bist du online?';
  return m||'Unbekannter Fehler.';}
function showView(login){$('#loginView').hidden=!login;$('#appView').hidden=login;$('#menu').hidden=login;if(login)setSync('local')}
function showLogin(msg,mode){
  mode=mode||'in';showView(true);
  $('#loginView').innerHTML='<div class="login">'
   +'<h1>Deine Woche</h1><p class="lead">Melde dich mit deinem Konto vom PAGS Lernplaner an. Noch keins? Leg hier eins an, es gilt für beide Apps.</p>'
   +'<div class="lseg" role="group" aria-label="Anmelden oder registrieren"><button data-lmode="in" aria-pressed="'+(mode==='in')+'">Anmelden</button><button data-lmode="up" aria-pressed="'+(mode==='up')+'">Neues Konto</button></div>'
   +'<form id="loginForm" class="lform" novalidate>'
   +'<div class="field"><label for="lg-user">Benutzername</label><input id="lg-user" autocomplete="username" autocapitalize="none" spellcheck="false"'+(mode==='up'?' placeholder="z. B. fuchs-9a"':'')+'></div>'
   +'<div class="field"><label for="lg-pass">Passwort</label><input id="lg-pass" type="password" autocomplete="'+(mode==='up'?'new-password':'current-password')+'"></div>'
   +(mode==='up'?'<div class="field"><label for="lg-pass2">Passwort wiederholen</label><input id="lg-pass2" type="password" autocomplete="new-password"></div>'
     +'<p class="note-s">Benutzername: 3–30 Zeichen, nur Kleinbuchstaben, Ziffern, Punkt, Bindestrich. Nimm bitte nicht deinen vollen Namen. Passwort: mindestens 8 Zeichen. Merk es dir gut, es gibt keine E-Mail zum Zurücksetzen.</p>':'')
   +'<p class="lmsg" id="lg-msg" role="alert">'+(msg?esc(msg):'')+'</p>'
   +'<button class="bigbtn" id="lg-go">'+(mode==='up'?'Konto anlegen':'Anmelden')+'</button></form>'
   +'<p class="note-s" style="text-align:center">Passwort vergessen? Wende dich an Herrn von Plotho-Kettner.</p></div>';
  $$('[data-lmode]').forEach(b=>b.onclick=()=>showLogin('',b.dataset.lmode));
  const say=t=>{$('#lg-msg').textContent=t};
  $('#loginForm').onsubmit=async e=>{e.preventDefault();
    const u=$('#lg-user').value.trim().toLowerCase(),pw=$('#lg-pass').value;
    if(!USER_RE.test(u)){say('Der Benutzername passt nicht: 3–30 Zeichen, nur a–z, 0–9, Punkt und Bindestrich.');return}
    if(pw.length<8){say('Das Passwort braucht mindestens 8 Zeichen.');return}
    const btn=$('#lg-go');btn.disabled=true;say(mode==='up'?'Konto wird angelegt …':'Anmeldung läuft …');
    let res;
    try{
      if(mode==='up'){
        if(pw!==$('#lg-pass2').value){btn.disabled=false;say('Die Passwörter sind nicht gleich.');return}
        res=await CLOUD.auth.signUp({email:toLogin(u),password:pw,options:{data:{username:u}}});
        if(!res.error&&!res.data.session){btn.disabled=false;say('Konto angelegt, aber noch nicht freigeschaltet. Bitte Herrn von Plotho-Kettner Bescheid sagen.');return}
      }else res=await CLOUD.auth.signInWithPassword({email:toLogin(u),password:pw});
    }catch(err){res={error:err}}
    if(res.error){btn.disabled=false;say(authMsg(res.error));return}
    await startUser(res.data.user);
  };
}
async function startUser(user){
  USER={id:user.id,name:(user.user_metadata&&user.user_metadata.username)||(user.email||'').split('@')[0]};
  lsSet(KEY+':last',JSON.stringify(USER));
  const local=loadLocal(),dirty=!!lsGet(storeKey()+':dirty');
  let remote=null,ok=true;
  try{const r=await CLOUD.from(TABLE).select('data,updated_at').eq('user_id',USER.id).maybeSingle();if(r.error)throw r.error;remote=r.data}catch(e){ok=false}
  let needPush=false;
  if(remote&&fix(remote.data)&&!(local&&dirty&&(local._savedAt||0)>new Date(remote.updated_at).getTime()))state=fix(remote.data);
  else if(local){state=local;needPush=dirty||!remote}
  else{
    // erstes Anmelden: bisher nur auf diesem Gerät gespeicherte Aufgaben übernehmen
    let anon=null;try{anon=fix(JSON.parse(lsGet(KEY)))}catch(e){}
    state=anon&&anon.tasks.length?anon:seed();needPush=true;
  }
  startApp(ok?'ok':'offline');
  if(needPush)save();
  if(user.user_metadata&&user.user_metadata.pw_reset)forcePw();
}
function forcePw(){
  openSheet('<div class="label" style="margin-top:0">Neues Passwort wählen</div>'
   +'<p class="note-s">Dein Passwort wurde zurückgesetzt. Wähle jetzt ein eigenes Passwort, das nur du kennst (mindestens 8 Zeichen).</p>'
   +'<div class="pwbox"><div class="field"><label for="fp1">Neues Passwort</label><input id="fp1" type="password" autocomplete="new-password"></div>'
   +'<div class="field"><label for="fp2">Wiederholen</label><input id="fp2" type="password" autocomplete="new-password"></div>'
   +'<p class="lmsg" id="fpm" role="alert"></p><button class="bigbtn" id="fpgo">Passwort speichern</button></div>',null,true);
  $('#fpgo').onclick=async()=>{const a=$('#fp1').value,b=$('#fp2').value,m=$('#fpm');
    if(a.length<8){m.textContent='Mindestens 8 Zeichen.';return}if(a!==b){m.textContent='Die Passwörter sind nicht gleich.';return}
    $('#fpgo').disabled=true;
    const {error}=await CLOUD.auth.updateUser({password:a,data:{pw_reset:false}});
    if(error){$('#fpgo').disabled=false;m.textContent=authMsg(error);return}
    try{await CLOUD.rpc('clear_pw_reset')}catch(e){}
    closeSheet(true);toast('Passwort gespeichert')};
}
async function logout(){
  await push();
  lsDel(storeKey());lsDel(storeKey()+':dirty');lsDel(KEY+':last');
  try{await CLOUD.auth.signOut()}catch(e){}
  USER=null;state=null;stack.innerHTML='';showLogin('Du bist abgemeldet.');
}
function startApp(sync){showView(false);normalize();render();setSync(sync||'local')}

async function boot(){
  const configured=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey);
  if(configured&&window.supabase){
    CLOUD=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'pags-lernplaner-auth'}});
    let session=null;try{session=(await CLOUD.auth.getSession()).data.session}catch(e){}
    if(session){await startUser(session.user);return}
    let last=null;try{last=JSON.parse(lsGet(KEY+':last'))}catch(e){}
    if(last&&navigator.onLine===false){USER=last;state=loadLocal()||seed();startApp('offline');return}
    showLogin();return;
  }
  if(configured){ // Bibliothek nicht geladen (offline)
    let last=null;try{last=JSON.parse(lsGet(KEY+':last'))}catch(e){}
    if(last){USER=last;state=loadLocal()||seed();startApp('offline');toast('Offline: Änderungen werden gespeichert, sobald du wieder online bist.');return}
    showView(true);$('#loginView').innerHTML='<div class="login"><h1>Keine Verbindung</h1><p class="lead">Für die erste Anmeldung brauchst du Internet.</p></div>';return;
  }
  state=loadLocal()||seed();startApp('local');
}

function tick(){if(state&&todayKey()!==today){normalize();render()}}
window.addEventListener('online',()=>{if(USER&&CLOUD){if(lsGet(storeKey()+':dirty'))push();else pull()}});
window.addEventListener('offline',()=>{if(USER)setSync('offline')});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(USER&&lsGet(storeKey()+':dirty'))push()}
  else{tick();pull()}
});
setInterval(tick,60000);
boot();
})();
</script>
