<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="author" content="Thorsten von Plotho-Kettner">
<title>Lernplaner Lehrkraft</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* PAGS-Design wie die Schüler-App. Layout: Kopf mit Logo, Login-Karte bzw. Kontenliste mit Suche, Aktionen je Zeile, Ergebnis-Fenster */
:root{
  --paper:#f4f4f4; --sheet:#ffffff; --ink:#2b2b2b; --muted:#666666; --line:#e1e1e1;
  --accent:#a81010; --accent-bg:#f9e9e9; --on-accent:#ffffff; --ok:#2f7d3a; --warn:#b45309; --bar:#333333;
  --f-display:"Roboto Condensed","Arial Narrow",Roboto,Arial,sans-serif;
  --f-body:Roboto,Arial,system-ui,sans-serif; --f-mono:"Roboto Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161616; --sheet:#222222; --ink:#eeeeee; --muted:#a8a8a8; --line:#3a3a3a;
  --accent:#f06262; --accent-bg:#3a1c1c; --on-accent:#1a1a1a; --ok:#7fcb88; --warn:#f0a35e; --bar:#0d0d0d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161616; --sheet:#222222; --ink:#eeeeee; --muted:#a8a8a8; --line:#3a3a3a;
  --accent:#f06262; --accent-bg:#3a1c1c; --on-accent:#1a1a1a; --ok:#7fcb88; --warn:#f0a35e; --bar:#0d0d0d; color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{border-top:6px solid var(--accent);background:var(--sheet);border-bottom:1px solid var(--line)}
.top .in,.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .in{display:flex;align-items:center;gap:14px;padding-block:12px}
.logo{height:46px;width:auto;border-radius:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#fff;padding:4px 6px}}
:root[data-theme="dark"] .logo{background:#fff;padding:4px 6px}
.name{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border-left:2px solid var(--line);padding-left:14px;line-height:1.15}
.name small{display:block;font-family:var(--f-body);font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.who{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.who button{border:0;background:none;color:var(--accent);font-weight:500;padding:2px 0}
.wrap{padding-block:22px 48px}
h1{font-family:var(--f-display);font-size:30px;margin:0 0 4px;text-wrap:balance}
.lead{margin:0 0 18px;color:var(--muted);max-width:62ch}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px}
.login{max-width:420px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:11px;min-width:0;width:100%}
.primary{border:0;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:0 18px;min-height:44px;font-weight:700}
.ghost{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:0 14px;min-height:38px;font-weight:500}
.danger{color:var(--accent)}
.msg{min-height:1.3em;margin:4px 0 10px;color:var(--accent);font-size:14px;font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:130px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:10px 12px}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--paper)}
tr:last-child td{border-bottom:0}
td.u{font-family:var(--f-mono);font-weight:500}
td.d{color:var(--muted);font-variant-numeric:tabular-nums}
td.act{text-align:right}
td.act .ghost{min-height:34px;padding:0 10px;font-size:14px}
.pill{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 8px;margin-left:6px;border:1px solid currentColor;font-family:var(--f-body);font-weight:500;vertical-align:1px}
.pill.t{color:var(--accent)}.pill.w{color:var(--warn)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--sheet);border-radius:14px;border-top:5px solid var(--accent);padding:20px;width:100%;max-width:440px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h2{font-family:var(--f-display);font-size:24px;margin:0 0 6px}
.dlg p{margin:0 0 12px}
.pw{font-family:var(--f-mono);font-size:30px;letter-spacing:.04em;text-align:center;background:var(--paper);border:2px dashed var(--line);border-radius:10px;padding:14px;margin:6px 0 12px;user-select:all;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.note{font-size:13px;color:var(--muted)}
.credit{margin-top:28px;font-size:11.5px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:#fff;border-radius:999px;padding:10px 16px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:560px){th.hide,td.hide{display:none}.who span{display:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <img class="logo" id="logo" alt="PAGS – Gemeinschaftsschule Külsheim" width="92" height="46">
  <div class="name">Lernplaner<small>Bereich für Lehrkräfte</small></div>
  <div class="who" id="who" hidden><span id="whoName"></span><br><button id="logout">Abmelden</button></div>
</div></header>
<main class="wrap" id="main"></main>
<div id="layer"></div>
<script src="config.js"></script>

const DOMAIN="lernplaner.pags-kuelsheim.de";
const CFG=window.LERNPLANER_CONFIG||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#logo").src=LOGO;
let DB=null, ME=null, USERS=[], q="";

function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),3500)}
const fmt=d=>{if(!d)return "–";const x=new Date(d);return x.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+x.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})};
const ago=d=>{if(!d)return "nie";const m=(Date.now()-new Date(d))/6e4;if(m<60)return "vor "+Math.max(1,Math.round(m))+" Min.";if(m<1440)return "vor "+Math.round(m/60)+" Std.";const t=Math.round(m/1440);return t===1?"gestern":"vor "+t+" Tagen"};
function errText(e){const m=(e&&e.message)||"";
  if(/Invalid login/i.test(m))return "Benutzername oder Passwort stimmt nicht.";
  if(/Keine Berechtigung/i.test(m))return "Dieses Konto ist nicht als Lehrkraft freigeschaltet.";
  if(/nicht gefunden/i.test(m))return "Dieses Konto gibt es nicht (mehr).";
  if(/Lehrkraft-Konten/i.test(m))return "Lehrkraft-Konten können hier nicht gelöscht werden.";
  if(/fetch|network/i.test(m))return "Keine Verbindung zum Server.";
  return m||"Unbekannter Fehler.";}

// gut vorlesbares Startpasswort, ohne verwechselbare Zeichen
function genPw(){const W=["Apfel","Birke","Wolke","Tiger","Kompass","Laterne","Insel","Rakete","Garten","Brücke","Feder","Sonne","Hafen","Kiesel","Fuchs","Mond","Ozean","Planet","Regen","Turm"];
  const r=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
  return W[r(W.length)]+"-"+W[r(W.length)].toLowerCase()+"-"+(10+r(90))}

function showLogin(msg){
  $("#who").hidden=true;
  $("#main").innerHTML=`<h1>Anmelden</h1><p class="lead">Nur für Lehrkräfte der PAGS. Melde dich mit deinem Lernplaner-Konto an, das als Lehrkraft freigeschaltet ist.</p>
   <form class="card login" id="lf" novalidate>
    <div class="field"><label for="lu">Benutzername</label><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="lp">Passwort</label><input id="lp" type="password" autocomplete="current-password"></div>
    <p class="msg" id="lm" role="alert">${esc(msg||"")}</p>
    <button class="primary" id="lb">Anmelden</button>
   </form><p class="credit">PAGS Lernplaner · entwickelt von Thorsten von Plotho-Kettner</p>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();
    const u=$("#lu").value.trim().toLowerCase(),p=$("#lp").value;if(!u||!p){$("#lm").textContent="Bitte Benutzername und Passwort eingeben.";return}
    $("#lb").disabled=true;$("#lm").textContent="Anmeldung läuft …";
    const {data,error}=await DB.auth.signInWithPassword({email:u+"@"+DOMAIN,password:p});
    if(error){$("#lb").disabled=false;$("#lm").textContent=errText(error);return}
    await enter(data.user);
  };
}
async function enter(user){
  const {data:ok,error}=await DB.rpc("am_i_admin");
  if(error||!ok){await DB.auth.signOut();showLogin(error?errText(error):"Dieses Konto ist nicht als Lehrkraft freigeschaltet.");return}
  ME=(user.user_metadata&&user.user_metadata.username)||user.email.split("@")[0];
  $("#whoName").textContent="Angemeldet als "+ME;$("#who").hidden=false;
  await load();
}
async function load(){
  const {data,error}=await DB.rpc("admin_list_users");
  if(error){toast(errText(error));if(/Berechtigung/.test(error.message))showLogin(errText(error));return}
  USERS=data||[];render();
}
function render(){
  const st=USERS.filter(u=>!u.is_admin), wk=Date.now()-7*864e5;
  const active=st.filter(u=>u.last_sign_in_at&&new Date(u.last_sign_in_at)>wk).length;
  const list=USERS.filter(u=>!q||u.username.includes(q));
  $("#main").innerHTML=`<h1>Konten</h1>
   <p class="lead">Hier setzt du Passwörter zurück und löschst Konten. Die Planer-Einträge der Schülerinnen und Schüler sind hier nicht sichtbar.</p>
   <div class="stats"><div class="stat"><b>${st.length}</b><span>Schülerkonten</span></div><div class="stat"><b>${active}</b><span>aktiv in den letzten 7 Tagen</span></div><div class="stat"><b>${st.filter(u=>u.must_change).length}</b><span>Startpasswort noch nicht geändert</span></div></div>
   <div class="tools"><input id="q" type="search" placeholder="Benutzername suchen …" value="${esc(q)}" aria-label="Benutzername suchen" autocapitalize="none"><button class="ghost" id="rl">Aktualisieren</button></div>
   <div class="tablewrap"><table><thead><tr><th>Benutzername</th><th class="hide">Angelegt</th><th>Zuletzt angemeldet</th><th class="hide">Zuletzt gespeichert</th><th></th></tr></thead><tbody>
   ${list.length?list.map(u=>`<tr><td class="u">${esc(u.username)}${u.is_admin?'<span class="pill t">Lehrkraft</span>':""}${u.must_change?'<span class="pill w">Startpasswort</span>':""}</td>
     <td class="d hide">${fmt(u.created_at)}</td><td class="d" title="${fmt(u.last_sign_in_at)}">${ago(u.last_sign_in_at)}</td><td class="d hide">${u.last_saved_at?ago(u.last_saved_at):"–"}</td>
     <td class="act"><button class="ghost" data-reset="${esc(u.username)}">Passwort zurücksetzen</button>${u.is_admin?"":` <button class="ghost danger" data-del="${esc(u.username)}">Löschen</button>`}</td></tr>`).join("")
     :`<tr><td colspan="5" class="empty">${USERS.length?"Kein Konto passt zur Suche.":"Noch keine Konten. Sobald sich Schülerinnen und Schüler registrieren, erscheinen sie hier."}</td></tr>`}
   </tbody></table></div>
   <p class="note" style="margin-top:12px">Tipp: Lass dir bei einem Reset den Benutzernamen zeigen und gleiche ihn genau ab. Nach dem Zurücksetzen werden alle Geräte des Kontos abgemeldet, beim nächsten Anmelden muss ein eigenes Passwort gewählt werden.</p>
   <p class="credit">PAGS Lernplaner · entwickelt von Thorsten von Plotho-Kettner</p>`;
  const qi=$("#q");qi.oninput=()=>{q=qi.value.trim().toLowerCase();const pos=qi.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
  $("#rl").onclick=async()=>{await load();toast("Aktualisiert")};
  document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>resetDlg(b.dataset.reset));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delDlg(b.dataset.del));
}
function dlg(html){$("#layer").innerHTML=`<div class="scrim" id="sc"><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`;$("#sc").onclick=e=>{if(e.target.id==="sc")close()}}
function close(){$("#layer").innerHTML=""}
function resetDlg(u){
  dlg(`<h2>Passwort zurücksetzen</h2><p>Neues Startpasswort für <b>${esc(u)}</b>:</p>
   <div class="field"><label for="np">Startpasswort (mind. 8 Zeichen)</label><input id="np" value="${genPw()}" style="font-family:var(--f-mono)"></div>
   <div class="row"><button class="ghost" id="cx">Abbrechen</button><button class="primary" id="go">Zurücksetzen</button></div>`);
  $("#cx").onclick=close;
  $("#go").onclick=async()=>{const pw=$("#np").value.trim();if(pw.length<8){toast("Mindestens 8 Zeichen");return}
    $("#go").disabled=true;const {error}=await DB.rpc("admin_reset_password",{p_username:u,p_password:pw});
    if(error){$("#go").disabled=false;toast(errText(error));return}
    dlg(`<h2>Erledigt</h2><p>Gib <b>${esc(u)}</b> dieses Startpasswort:</p><div class="pw" id="pwshow">${esc(pw)}</div>
     <p class="note">Das Passwort wird nur jetzt angezeigt. Beim nächsten Anmelden muss ein eigenes Passwort gewählt werden.</p>
     <div class="row"><button class="ghost" id="cp">Kopieren</button><button class="primary" id="ok">Fertig</button></div>`);
    $("#cp").onclick=()=>{try{navigator.clipboard.writeText(pw).then(()=>toast("Kopiert"),()=>sel())}catch(e){sel()}};
    const sel=()=>{const r=document.createRange();r.selectNodeContents($("#pwshow"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Markiert, bitte kopieren")};
    $("#ok").onclick=()=>{close();load()};
  };
}
function delDlg(u){
  dlg(`<h2>Konto löschen</h2><p>Das Konto <b>${esc(u)}</b> und alle Einträge darin werden endgültig gelöscht. Das lässt sich nicht rückgängig machen.</p>
   <div class="field"><label for="cf">Zur Bestätigung den Benutzernamen eintippen</label><input id="cf" autocapitalize="none" autocomplete="off"></div>
   <div class="row"><button class="ghost" id="cx">Abbrechen</button><button class="primary" id="go" disabled>Endgültig löschen</button></div>`);
  $("#cx").onclick=close;$("#cf").oninput=()=>{$("#go").disabled=$("#cf").value.trim().toLowerCase()!==u};
  $("#go").onclick=async()=>{$("#go").disabled=true;const {error}=await DB.rpc("admin_delete_user",{p_username:u});
    if(error){toast(errText(error));$("#go").disabled=false;return}close();toast("Konto gelöscht");load()};
}
$("#logout").onclick=async()=>{await DB.auth.signOut();ME=null;showLogin("Du bist abgemeldet.")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sc"))close()});

(async()=>{
  if(!CFG.supabaseUrl||!window.supabase){$("#main").innerHTML=`<h1>Keine Verbindung</h1><p class="lead">Die Datenbank ist nicht erreichbar. Bist du online?</p>`;return}
  DB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"pags-lernplaner-lehrkraft"}});
  const s=(await DB.auth.getSession()).data.session;
  if(s)await enter(s.user);else showLogin();
})();
})();
</script>
</body>
</html>
