<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Korrekturtabelle</title>
<meta name="description" content="Korrekturtabelle für Lehrkräfte der Pater-Alois-Grimm-Schule Külsheim: Notenschlüssel, Korrektur nach Aufgaben, Leistungsübersicht">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#383838">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Gleiche Gestaltung wie Lernplaner, Wochenstapel und Lernbegleiter: PAGS-Kopf, Karten auf hellgrauem Grund, Entwickler-Fußzeile */
:root{
  --bg:#F2F2F0; --card:#FFFFFF; --ink:#2B2B2C; --mute:#6E6E72; --line:#DCDCDA; --chip:#E8E8E6;
  --accent:#AD120D; --accent-soft:#F6E3E2; --scrim:rgba(24,24,26,.4); --danger:#AD120D;
  --shadow:0 12px 32px rgba(20,20,22,.18); --logo-bg:#FFFFFF;
  --g1:#DCEFE3; --g2:#EAF4E4; --g3:transparent; --g4:#FBF1DC; --g5:#F8DEDA; --g6:#F1C9C4;
  --ok:#1F7A4D; --warn:#A45A00; --bar:#383838;
  --f-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161618; --card:#212124; --ink:#ECECEE; --mute:#9A9A9F; --line:#34343A; --chip:#2A2A2F;
  --accent:#E24A40; --accent-soft:#3A1F1E; --scrim:rgba(0,0,0,.6); --danger:#FF6B61;
  --shadow:0 12px 32px rgba(0,0,0,.55); --logo-bg:#F4F4F2;
  --g1:#1E3A2B; --g2:#24352A; --g3:transparent; --g4:#3A321F; --g5:#45261F; --g6:#5A2420;
  --ok:#5DBF98; --warn:#F2B732; --bar:#D4D4D8; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161618; --card:#212124; --ink:#ECECEE; --mute:#9A9A9F; --line:#34343A; --chip:#2A2A2F;
  --accent:#E24A40; --accent-soft:#3A1F1E; --scrim:rgba(0,0,0,.6); --danger:#FF6B61;
  --shadow:0 12px 32px rgba(0,0,0,.55); --logo-bg:#F4F4F2;
  --g1:#1E3A2B; --g2:#24352A; --g3:transparent; --g4:#3A321F; --g5:#45261F; --g6:#5A2420;
  --ok:#5DBF98; --warn:#F2B732; --bar:#D4D4D8; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
[hidden]{display:none!important}

/* Kopf */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 6px}
.logo{display:block;background:var(--logo-bg);border-radius:10px;padding:8px 12px;line-height:0}
.logo img{height:48px;width:auto}
.iconbtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--mute)}
.iconbtn:hover,.iconbtn:active{background:var(--chip)}
.intro{padding-block:14px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
h1{margin:6px 0 0;font-family:var(--f-display);font-size:34px;line-height:1;font-weight:900;letter-spacing:-.01em;text-transform:uppercase}
.status{font-size:13px;color:var(--mute);font-weight:600}
.status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--ok);margin-right:6px;vertical-align:1px}

/* Reiter */
.tabs{display:flex;gap:6px;margin:16px 0 4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 16px;border-radius:12px;font-weight:700;color:var(--mute);background:transparent;white-space:nowrap}
.tab:hover{background:var(--chip)}
.tab.on{background:var(--ink);color:var(--bg)}

/* Bausteine */
.card{background:var(--card);border-radius:14px;padding:16px}
.section{margin-top:18px}
h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:-.005em}
h3{margin:0 0 10px;font-family:var(--f-display);font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:13px;font-weight:700;color:var(--mute)}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);outline:none;min-width:0}
.inp:focus{border-color:var(--accent)}
.inp.num{width:110px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:8px;font-size:14px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:12px;font-weight:700;background:var(--chip);text-align:center;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent}
.btn svg{flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:var(--chip);font-size:14px;font-weight:700}
.chip.on{background:var(--ink);color:var(--bg)}
.chip small{font-weight:600;opacity:.75}
.pill{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--mute)}
.pill.ka{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:36px 16px}
.empty p{max-width:460px;margin:8px auto 16px;color:var(--mute)}

/* Notenschlüssel */
.lookup{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:18px;font-weight:800;color:var(--mute);margin-left:6px}
.limits{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
.limit{background:var(--chip);border-radius:10px;padding:8px 6px;text-align:center}
.limit b{display:block;font-family:var(--f-display);font-size:22px}
.limit span{font-size:13px;color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.keycols{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 18px;align-items:start}
.keycols table{width:100%;break-inside:avoid}
.keytable{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;width:100%}
.keytable th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:right;padding:4px 6px;border-bottom:2px solid var(--line)}
.keytable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--line);break-inside:avoid}
.keytable tr.whole td{font-weight:700}
.keyrow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;break-inside:avoid;font-variant-numeric:tabular-nums;font-size:15px;border-bottom:1px solid var(--line)}
.keyrow>span{padding:3px 6px;text-align:right}
.keyrow.head{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);border-bottom:2px solid var(--line);font-weight:700}
.keyrow .t{font-weight:700}

/* Tabellen */
.tablewrap{overflow-x:auto;background:var(--card);border-radius:14px;margin-top:12px;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:15px;min-width:100%}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
table.grid thead th{position:sticky;top:0;background:var(--card);font-size:13px;font-weight:800;color:var(--mute);padding:8px 6px;z-index:1}
table.grid th.name,table.grid td.name{position:sticky;left:0;background:var(--card);text-align:left;padding:6px 12px;z-index:2;font-weight:600;min-width:150px;max-width:220px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
table.grid thead th.name{z-index:3}
table.grid td input{width:64px;padding:8px 4px;border:0;background:transparent;text-align:center;outline:none;border-radius:6px;font-variant-numeric:tabular-nums}
table.grid td input:focus{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
table.grid td input.bad{color:var(--danger);font-weight:800;box-shadow:inset 0 0 0 2px var(--danger)}
table.grid td.out{padding:6px 10px;font-weight:700;background:var(--bg)}
table.grid td.out.strong{font-family:var(--f-display);font-weight:800}
table.grid tfoot td{font-weight:700;color:var(--mute);padding:8px 6px;font-size:14px;background:var(--card)}
table.grid tfoot td.name{color:var(--mute)}
.colbtn{font-weight:800;color:var(--ink);padding:4px 8px;border-radius:8px;display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.colbtn:hover{background:var(--chip)}
.colbtn small{font-size:11px;color:var(--mute);font-weight:700}
.sep{border-left:2px solid var(--line)!important}
.c1{background:var(--g1)!important}.c2{background:var(--g2)!important}.c4{background:var(--g4)!important}.c5{background:var(--g5)!important}.c6{background:var(--g6)!important}
.p4{background:var(--g1)!important}.p3{background:var(--g2)!important}.p2{background:var(--g4)!important}.p1{background:var(--g5)!important}

/* Statistik */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute);font-weight:700}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;padding-top:6px}
.barcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.barcol .bar{width:100%;max-width:56px;background:var(--bar);border-radius:6px 6px 2px 2px;min-height:2px}
.barcol .bar.bad{background:var(--accent)}
.barcol .n{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.barcol .l{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--mute)}
.taskbars{display:flex;flex-direction:column;gap:6px}
.tb{display:grid;grid-template-columns:90px 1fr 54px;gap:10px;align-items:center;font-size:14px}
.tb .track{height:12px;background:var(--chip);border-radius:6px;overflow:hidden}
.tb .fill{height:100%;background:var(--bar);border-radius:6px}
.tb .fill.low{background:var(--accent)}
.tb b{text-align:right;font-variant-numeric:tabular-nums}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;margin-top:10px}
.alert svg{flex:none;color:var(--accent);margin-top:2px}

/* Listen */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px 16px;text-align:left;width:100%}
.item:hover{box-shadow:inset 0 0 0 2px var(--line)}
.item .t{font-weight:700;font-size:17px}
.item .s{font-size:14px;color:var(--mute)}
.item .grow{flex:1;min-width:0}
.groupchips{display:flex;gap:6px;flex-wrap:wrap}

/* Fußzeile */
.foot{margin-top:48px;padding-block:20px 40px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.foot strong{color:var(--ink);font-weight:700}
.foot a{color:inherit}

/* Bottom-Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:620px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(calc(100% + 60px));visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;
  max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.sheet.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin-bottom:8px}
.label{font-family:var(--f-display);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.sheet textarea.inp{min-height:180px;resize:vertical;line-height:1.5}
.btnrow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:var(--card);border-radius:12px;margin-top:8px;width:100%;text-align:left;font-weight:600}
.setting small{display:block;font-weight:400;color:var(--mute);font-size:14px;margin-top:2px}
.switch{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--card);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.keyedit{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.keyedit label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--mute)}
.keyedit input{width:100%}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:12px;font-weight:600;transition:all .25s;z-index:80;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1}

.printhead{display:none}
@media (max-width:640px){
  h1{font-size:28px}
  .logo img{height:40px}
  .big{font-size:36px}
  .limits{grid-template-columns:repeat(3,1fr)}
  .inp.num{width:76px}
  table.grid th.name,table.grid td.name{min-width:108px;max-width:140px}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  :root{--card:#fff;--bg:#fff;--chip:#eee;--line:#bbb;--ink:#000;--mute:#444}
  .masthead,.tabs,.intro,.foot,.noprint,.scrim,.sheet,.toast{display:none!important}
  .printhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .printhead img{height:36px}
  .printhead b{font-family:var(--f-display);font-size:16pt;text-transform:uppercase}
  .printhead small{display:block;font-size:9pt;color:#444}
  .tablewrap{overflow:visible;border-radius:0}
  table.grid{font-size:9.5pt}
  table.grid td input{width:auto;padding:2px}
  table.grid th.name,table.grid td.name{position:static}
  table.grid thead th{position:static}
  .card,.stat{border:1px solid #ccc}
  .keycols{grid-template-columns:repeat(4,1fr)}
  .keyrow{font-size:9.5pt}
  .section{break-inside:avoid}
}
</style>
</head>

<script>
(function(){
"use strict";
var KEY="pags-korrektur-v1", VERSION="1.0";

var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var main=$("#main");

/* ---------- Zustand ---------- */
function defaults(){return {
  v:1,
  ui:{view:"schluessel",group:null,exam:null},
  settings:{theme:"auto",third:true,avgLimit:""},
  calc:{total:52,mode:"lin",mid:3.5,step:0.5,probe:""},
  pkey:[92,81,67,50,30],
  groups:[],exams:[]
}}
var S=load();
function load(){
  try{var raw=localStorage.getItem(KEY); if(raw){var d=JSON.parse(raw); return merge(defaults(),d)}}catch(e){}
  return defaults();
}
function merge(a,b){for(var k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]}return a}
var saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    try{localStorage.setItem(KEY,JSON.stringify(S));$("#saved").textContent="Auf diesem Gerät gespeichert"}
    catch(e){$("#saved").textContent="Speichern nicht möglich – bitte Sicherung herunterladen"}
  },250);
}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* ---------- Zahlen und Noten ---------- */
function num(s){if(s==null)return null;if(typeof s==="number")return isFinite(s)?s:null;s=String(s).trim().replace(",",".");if(s==="")return null;var n=Number(s);return isFinite(n)?n:NaN}
function fmt(n,d){if(n==null||isNaN(n))return "–";var s=d==null?String(Math.round(n*100)/100):n.toFixed(d);return s.replace(".",",")}
function fmtPts(n){if(n==null||isNaN(n))return "–";return String(Math.round(n*100)/100).replace(".",",")}
/* Noteneingabe: 2,5 · 2- (=2,25) · 2+ (=1,75) · 2-3 (=2,5) */
function grade(s){
  if(s==null)return null; s=String(s).trim(); if(s==="")return null;
  var m=s.match(/^([1-6])\s*([+-])$/); if(m)return Number(m[1])+(m[2]==="-"?0.25:-0.25);
  m=s.match(/^([1-6])\s*[-\/]\s*([1-6])$/); if(m&&Number(m[2])===Number(m[1])+1)return Number(m[1])+0.5;
  var n=num(s); if(n==null||isNaN(n)||n<0.7||n>6)return NaN; return n;
}
function tend(g){
  if(g==null||isNaN(g))return "–";
  var q=Math.round(g*4)/4,n=Math.floor(q),f=q-n;
  if(f===0)return String(n); if(f===0.25)return n+"-"; if(f===0.5)return n+"-"+(n+1); return (n+1)+"+";
}
function gtext(g,mode){if(g==null||isNaN(g))return "–";if(mode==="ganz")return String(whole(g));if(mode==="dez")return fmt(g,1);if(mode==="dez2")return fmt(g,2);return tend(g)}
function whole(g){return Math.min(6,Math.max(1,Math.floor(g+0.5)))}
function gcls(g){if(g==null||isNaN(g))return "";var w=whole(g);return w===3?"":"c"+w}
function pcls(p){if(p==null||isNaN(p))return "";return p>80?"p4":p>60?"p3":p>20?"p2":"p1"}
/* Blatt „9-10“: Note = 6 − P·5/G + (Note50 − 3,5)/(G/2)·(G − P), höchstens 6 */
function linGrade(P,G,mid){if(!(G>0)||P==null||isNaN(P))return null;var g=6-P*5/G+(mid-3.5)/(G/2)*(G-P);return Math.max(1,Math.min(6,g))}
function pkeyGrade(p){var k=S.pkey;for(var i=0;i<5;i++){if(p>=k[i])return i+1}return 6}
function pctGrade(p,mode,mid){if(p==null||isNaN(p))return null;return mode==="pkey"?pkeyGrade(p):linGrade(p,100,mid)}
function mean(a){var v=a.filter(function(x){return x!=null&&!isNaN(x)});if(!v.length)return null;return v.reduce(function(s,x){return s+x},0)/v.length}

/* ---------- UI-Hilfen ---------- */
var toastT;
function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove("on")},2400)}
function openSheet(html,bind){
  var sh=$("#sheet");sh.innerHTML='<div class="grab"></div>'+html;
  $("#scrim").classList.add("on");sh.classList.add("on");sh.scrollTop=0;
  if(bind)bind(sh);
  var f=$("[autofocus]",sh);if(f)setTimeout(function(){f.focus()},280);
}
function closeSheet(){$("#scrim").classList.remove("on");$("#sheet").classList.remove("on")}
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
function confirmSheet(title,text,ok,cb){
  openSheet('<h2>'+esc(title)+'</h2><p class="muted">'+esc(text)+'</p><div class="btnrow"><button class="btn" data-x>Abbrechen</button><button class="btn accent" data-ok>'+esc(ok)+'</button></div>',function(sh){
    $("[data-x]",sh).onclick=closeSheet;$("[data-ok]",sh).onclick=function(){closeSheet();cb()};
  });
}
function applyTheme(){var t=S.settings.theme;if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}
var ICON={
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  print:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></svg>',
  xls:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 11l6 6M15 11l-6 6"/></svg>',
  edit:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  send:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  warn:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22L12 2zm1 15h-2v2h2v-2zm0-7h-2v5h2v-5z"/></svg>'
};
function seg(name,opts,val){return '<div class="seg" data-seg="'+name+'">'+opts.map(function(o){return '<button type="button" data-v="'+o[0]+'" class="'+(String(o[0])===String(val)?"on":"")+'">'+o[1]+'</button>'}).join("")+'</div>'}
function bindSeg(root,name,cb){var el=$('[data-seg="'+name+'"]',root);if(!el)return;$$("button",el).forEach(function(b){b.onclick=function(){$$("button",el).forEach(function(x){x.classList.toggle("on",x===b)});cb(b.dataset.v)}})}
function setPrint(title,sub){$("#printTitle").textContent=title;$("#printSub").textContent=sub||""}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateDe(s){if(!s)return "";var p=s.split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:s}
function getGroup(id){return S.groups.find(function(g){return g.id===id})}
function getExam(id){return S.exams.find(function(e){return e.id===id})}

/* Tastatur in Tabellen: Enter/↓ = nächste Zeile, ↑ = vorige Zeile */
function gridNav(table){
  table.addEventListener("keydown",function(e){
    var t=e.target;if(t.tagName!=="INPUT")return;
    var r=+t.dataset.r,c=+t.dataset.c,nr=null;
    if(e.key==="Enter"||e.key==="ArrowDown")nr=r+(e.shiftKey&&e.key==="Enter"?-1:1);
    else if(e.key==="ArrowUp")nr=r-1;
    if(nr==null)return;
    var n=$('input[data-r="'+nr+'"][data-c="'+c+'"]',table);
    if(!n&&e.key==="Enter"&&!e.shiftKey)n=$('input[data-r="0"][data-c="'+(c+1)+'"]',table);
    if(n){e.preventDefault();n.focus();n.select()}
  });
  table.addEventListener("focusin",function(e){if(e.target.tagName==="INPUT")setTimeout(function(){try{e.target.select()}catch(_){}},0)});
}

/* ---------- Navigation ---------- */
$$("#tabs .tab").forEach(function(b){b.onclick=function(){S.ui.view=b.dataset.view;if(b.dataset.view==="korrektur")S.ui.exam=null;save();render()}});
function render(){
  $$("#tabs .tab").forEach(function(b){b.classList.toggle("on",b.dataset.view===S.ui.view)});
  ({schluessel:viewKey,korrektur:viewExam,leb:viewLeb,gruppen:viewGroups}[S.ui.view]||viewKey)();
}

/* =========================================================
   1) NOTENSCHLÜSSEL (Blätter „1-8“ und „9-10“)
   ========================================================= */
function keyGradeFor(P){var c=S.calc;if(c.mode==="lin")return linGrade(P,c.total,c.mid);if(c.mode==="pkey")return pkeyGrade(P/c.total*100);return null}
function limitsFor(total,mode,mid,step){
  /* kleinste Punktzahl, ab der die (gerundete) ganze Note erreicht wird */
  var out=[];step=step||0.5;
  for(var n=1;n<=5;n++){
    var found=null;
    for(var P=0;P<=total+1e-9;P=Math.round((P+step)*1000)/1000){
      var g=mode==="pkey"?pkeyGrade(P/total*100):linGrade(P,total,mid);
      if(whole(g)<=n){found=P;break}
    }
    out.push(found);
  }
  return out;
}
function viewKey(){
  var c=S.calc;
  setPrint("Notenschlüssel","Gesamtpunktzahl "+fmtPts(c.total)+(c.mode==="lin"?" · 50 % = Note "+fmt(c.mid,1):c.mode==="pkey"?" · Prozent-Notenschlüssel":" · Umrechnung in Prozent"));
  main.innerHTML=
  '<section class="section card noprint">'+
    '<div class="row" style="gap:16px;align-items:flex-end">'+
      '<label class="field"><span>Gesamtpunktzahl</span><input class="inp num" id="kTotal" inputmode="decimal" value="'+fmtPts(c.total)+'"></label>'+

var KOMP={L:"Listening",R:"Reading",W:"Writing",M:"Mediation"};
function examMax(ex){return ex.tasks.reduce(function(s,t){return s+(num(t.max)||0)},0)}
function examRow(ex,sid){
  var pts=ex.pts[sid]||{},sum=0,any=false,bad=false;
  ex.tasks.forEach(function(t){var v=num(pts[t.id]);if(v!=null){if(isNaN(v)||v<0||v>num(t.max)){bad=true;return}sum+=v;any=true}});
  if(!any)return {sum:null,pct:null,g:null,bad:bad};
  var max=examMax(ex),pct=max?sum/max*100:null;
  var g=ex.mode==="pkey"?pkeyGrade(pct):linGrade(sum,max,ex.mid);
  return {sum:sum,pct:pct,g:g,bad:bad};
}
function examStats(ex,grp){
  var rows=grp.students.map(function(s){return examRow(ex,s.id)}).filter(function(r){return r.sum!=null});
  var spiegel=[0,0,0,0,0,0];
  rows.forEach(function(r){spiegel[whole(r.g)-1]++});
  var n=rows.length;
  return {n:n,avg:mean(rows.map(function(r){return r.g})),avgPct:mean(rows.map(function(r){return r.pct})),spiegel:spiegel,
    bad:n?(spiegel[4]+spiegel[5])/n:0,
    tasks:ex.tasks.map(function(t){var vals=grp.students.map(function(s){var v=num((ex.pts[s.id]||{})[t.id]);return v==null||isNaN(v)?null:v}).filter(function(v){return v!=null});var m=mean(vals);return {t:t,avg:m,pct:m!=null&&num(t.max)?m/num(t.max)*100:null}})};
}

function sendExam(ex){
  var grp=getGroup(ex.groupId);

  var col=grp.cols.find(function(c){return c.examId===ex.id}),isNew=!col,n=0;
  if(grp.kind==="noten"){
    if(!col){col={id:uid(),type:ex.type==="KA"?"KA":"T",label:nextLabel(grp,ex.type==="KA"?"KA":"T"),w:null,examId:ex.id,title:ex.title};grp.cols.push(col)}
    grp.students.forEach(function(s){var r=examRow(ex,s.id);grp.vals[s.id]=grp.vals[s.id]||{};if(r.g!=null){grp.vals[s.id][col.id]=gtext(r.g,ex.fmt==="ganz"?"ganz":ex.fmt==="tend"?"tend":"dez2");n++}});
  }else{
    var tagged=ex.tasks.some(function(t){return t.komp});
    var type=ex.type==="KA"&&tagged?"KA":"T";
    if(col&&col.type!==type){grp.cols=grp.cols.filter(function(c){return c!==col});col=null;isNew=true}
    if(!col){col={id:uid(),type:type,label:nextLabel(grp,type),examId:ex.id,title:ex.title};grp.cols.push(col)}
    grp.students.forEach(function(s){
      var r=examRow(ex,s.id);if(r.sum==null)return;grp.vals[s.id]=grp.vals[s.id]||{};n++;
      if(type==="T"){grp.vals[s.id][col.id]=fmt(Math.round(r.pct*10)/10)}
      else{var o={},p=ex.pts[s.id]||{};["L","R","W","M"].forEach(function(k){var ts=ex.tasks.filter(function(t){return t.komp===k});if(!ts.length)return;var mx=0,sm=0;ts.forEach(function(t){mx+=num(t.max);sm+=num(p[t.id])||0});o[k]=fmt(Math.round(sm/mx*1000)/10)});grp.vals[s.id][col.id]=o}
    });
  }
  save();
  toast(n+" Ergebnisse "+(isNew?"als „"+col.label+"“ ":"in „"+col.label+"“ ")+"übertragen");

}

/* =========================================================
   3) LEISTUNGSÜBERSICHT (Blätter „LEB“ und „LEB Englisch“)
   ========================================================= */
var TYPES={KA:"Klassenarbeit",T:"Kurztest / Vokabeltest",MA:"Mitarbeit",S:"Sonstiges"};
var KTYPES={KA:"Klassenarbeit (List · Read · Writ · Med)",T:"Test",S:"Sprechen"};
function colWeight(grp,c){return c.w!=null&&c.w!==""&&!isNaN(num(c.w))?num(c.w):(grp.weights[c.type]!=null?grp.weights[c.type]:1)}
/* gewichteter Durchschnitt: Σ(Note·Gewicht) / Σ(Gewicht der belegten Felder) */
function lebNote(grp,sid){
  var v=grp.vals[sid]||{},sw=0,sx=0;
  grp.cols.forEach(function(c){var g=grade(v[c.id]);if(g==null||isNaN(g))return;var w=colWeight(grp,c);sw+=w;sx+=g*w});
  return sw?sx/sw:null;
}
/* Englisch: Ø je Kompetenz über alle Klassenarbeiten, Tests zählen zu Mediation (wie im Original) oder eigen */
function kompRow(grp,sid){
  var v=grp.vals[sid]||{},acc={L:[],R:[],W:[],M:[],T:[],S:[]};
  grp.cols.forEach(function(c){
    var x=v[c.id];
    if(c.type==="KA"){if(x&&typeof x==="object")["L","R","W","M"].forEach(function(k){var n=num(x[k]);if(n!=null&&!isNaN(n))acc[k].push(n)})}
    else{var n=num(typeof x==="object"?null:x);if(n!=null&&!isNaN(n)){if(c.type==="T"){if(grp.testsInto==="M")acc.M.push(n);else acc.T.push(n)}else acc.S.push(n)}}
  });
  var r={L:mean(acc.L),R:mean(acc.R),W:mean(acc.W),M:mean(acc.M),S:mean(acc.S)};
  if(grp.testsInto!=="M")r.T=mean(acc.T);
  var parts=["L","R","W","M"].concat(grp.testsInto!=="M"?["T"]:[]).concat(["S"]).map(function(k){return r[k]});
  r.avg=mean(parts);
  r.g=r.avg==null?null:pctGrade(r.avg,grp.noteMode||"lin",grp.noteMid||3.5);
  return r;
}

function importWorkbook(X,wb,fname){
  var made=[],base=fname.replace(/\.[^.]+$/,"");
  function rows(ws){return X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null})}
  /* Punktzahlen aus „1-8“ und „9-10“ */
  if(wb.Sheets["9-10"]){var r=rows(wb.Sheets["9-10"]);var tot=r[2]&&num(r[2][0]),mid=r[1]&&num(r[1][5]);if(tot>0)S.calc.total=tot;if(mid>=1&&mid<=6)S.calc.mid=mid}
  else if(wb.Sheets["1-8"]){var r2=rows(wb.Sheets["1-8"]);var t2=r2[1]&&num(r2[1][2]);if(t2>0)S.calc.total=t2}
  /* LEB */
  var leb=wb.Sheets["LEB"];
  if(leb){
    var R=rows(leb),hi=R.findIndex(function(x){return x&&String(x[0]||"").trim()==="Name"});
    if(hi>=0){
      var g={id:uid(),name:base+" (LEB)",kind:"noten",students:[],weights:{KA:2,T:1,MA:1,S:1},cols:[],vals:{},fmt:"dez2"};
      for(var i=0;i<hi;i++){var a=String((R[i]||[])[0]||""),w=num((R[i]||[])[1]);if(w==null||isNaN(w))continue;if(/Klassenarbeit/.test(a))g.weights.KA=w;else if(/Kurztest|Vokabel/.test(a))g.weights.T=w;else if(/Mitarbeit/.test(a))g.weights.MA=w;else if(/Sonstig/.test(a))g.weights.S=w}
      var H=R[hi],cmap=[],cnt={};
      for(var c=1;c<H.length;c++){var lab=String(H[c]||"").trim();if(!lab||/^Gesamt|^Ø/.test(lab))break;var ty=(lab.match(/^(KA|MA|T|S)\b/)||[])[1]||"S";cnt[ty]=(cnt[ty]||0)+1;var lb=/^(MA|S)$/.test(lab)?lab+" "+cnt[ty]:lab;var col={id:uid(),type:ty,label:lb,w:null};g.cols.push(col);cmap[c]=col}
      for(var j=hi+1;j<R.length;j++){var row=R[j]||[],nm=String(row[0]||"").trim();if(!nm)continue;var s={id:uid(),name:nm};g.students.push(s);g.vals[s.id]={};cmap.forEach(function(col,ci){var v=row[ci];if(v!=null&&v!==""&&!isNaN(num(v)))g.vals[s.id][col.id]=fmt(num(v))})}
      S.groups.push(g);made.push(g.name+" · "+g.students.length+(g.students.length===1?" Name":" Namen"));
    }
  }
  /* LEB Englisch */
  var en=wb.Sheets["LEB Englisch"];
  if(en){
    var E=rows(en),hj=E.findIndex(function(x){return x&&String(x[0]||"").trim()==="Name"});
    if(hj>=0){
      var ge={id:uid(),name:base+" (Englisch)",kind:"komp",students:[],weights:{KA:2,T:1,MA:1,S:1},cols:[],vals:{},testsInto:"M"};
      var HE=E[hj],top=E[hj-1]||[],map=[],sc=0,kc=0,K=["L","R","W","M"];
      for(var c2=1;c2<HE.length;c2++){
        var l2=String(HE[c2]||"").trim();if(!l2)continue;if(/^Gesamt/.test(String(top[c2]||""))||l2==="Ø")break;
        if(l2==="List"){kc++;var kcol={id:uid(),type:"KA",label:String(top[c2]||("KA "+kc)).trim()};ge.cols.push(kcol);for(var q=0;q<4;q++)map[c2+q]={col:kcol,k:K[q]};c2+=3;continue}
        if(/^T\s*\d+/.test(l2)){var tc={id:uid(),type:"T",label:l2};ge.cols.push(tc);map[c2]={col:tc};continue}
        if(l2==="S"){sc++;var scol={id:uid(),type:"S",label:"S "+sc};ge.cols.push(scol);map[c2]={col:scol}}
      }
      for(var j2=hj+1;j2<E.length;j2++){var rw=E[j2]||[],n2=String(rw[0]||"").trim();if(!n2)continue;var st={id:uid(),name:n2},vv={};ge.students.push(st);ge.vals[st.id]=vv;
        map.forEach(function(m,ci){var v=rw[ci];if(v==null||v===""||isNaN(num(v)))return;if(m.k){vv[m.col.id]=vv[m.col.id]||{};vv[m.col.id][m.k]=fmt(num(v))}else vv[m.col.id]=fmt(num(v))})}
      S.groups.push(ge);made.push(ge.name+" · "+ge.students.length+(ge.students.length===1?" Name":" Namen"));
    }
  }
  save();
  if(!made.length){toast("Keine Blätter „LEB“ oder „LEB Englisch“ gefunden – Punktzahlen übernommen");render();return}
  closeSheet();S.ui.view="leb";S.ui.group=S.groups[S.groups.length-made.length].id;render();
  openSheet('<h2>Import fertig</h2><p>Neu angelegt:</p><ul>'+made.map(function(m){return '<li>'+esc(m)+'</li>'}).join("")+'</ul><p class="muted small">Benenne die Lerngruppen unter „Lerngruppen“ um (z. B. „9a Deutsch“). Die Punktzahl für den Notenschlüssel wurde ebenfalls übernommen.</p><div class="btnrow"><button class="btn primary" data-x>Gut</button></div>',function(sh){$("[data-x]",sh).onclick=closeSheet});
}
