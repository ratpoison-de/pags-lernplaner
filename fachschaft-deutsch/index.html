<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fachschaft Deutsch</title>
<meta name="description" content="Gemeinsame App der Fachschaft Deutsch an der Pater-Alois-Grimm-Schule Külsheim">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Fachschaft Deutsch – gleiche Gestaltung wie Lernbegleiter und Wochenstapel: PAGS-Kopf, Karten, Entwickler-Fußzeile */
:root{
  --bg:#F2F2F0; --card:#FFFFFF; --ink:#2B2B2C; --mute:#6E6E72; --line:#DCDCDA; --chip:#E8E8E6;
  --accent:#AD120D; --accent-ink:#FFFFFF; --done:#A9A9A7; --scrim:rgba(24,24,26,.4);
  --danger:#AD120D; --shadow:0 12px 32px rgba(20,20,22,.18); --logo-bg:#FFFFFF; --star:#D99A00;
  --s1:#3B6EA8; --s2:#7A5AA6; --s3:#2E8B6A; --s4:#AD120D; --s5:#B8650F;
  --f-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161618; --card:#212124; --ink:#ECECEE; --mute:#9A9A9F; --line:#2E2E32; --chip:#29292D;
  --accent:#E24A40; --accent-ink:#1A0605; --done:#5C5C61; --scrim:rgba(0,0,0,.6);
  --danger:#FF6B61; --shadow:0 12px 32px rgba(0,0,0,.55); --logo-bg:#F4F4F2; --star:#F2B732;
  --s1:#6E9BD1; --s2:#A88BD1; --s3:#5DBF98; --s4:#E24A40; --s5:#E39A4B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161618; --card:#212124; --ink:#ECECEE; --mute:#9A9A9F; --line:#2E2E32; --chip:#29292D;
  --accent:#E24A40; --accent-ink:#1A0605; --done:#5C5C61; --scrim:rgba(0,0,0,.6);
  --danger:#FF6B61; --shadow:0 12px 32px rgba(0,0,0,.55); --logo-bg:#F4F4F2; --star:#F2B732;
  --s1:#6E9BD1; --s2:#A88BD1; --s3:#5DBF98; --s4:#E24A40; --s5:#E39A4B; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto}

/* Kopf */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 6px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{display:block;background:var(--logo-bg);border-radius:10px;padding:7px 11px;line-height:0;flex:none}
.logo img{height:44px;width:auto}
.appname{font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.15;text-transform:uppercase;letter-spacing:.01em;min-width:0}
.appname small{display:block;font-family:var(--f-body);font-weight:600;font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--mute)}
.headright{display:flex;align-items:center;gap:2px}
.iconbtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--mute)}
.iconbtn:hover,.iconbtn:active{background:var(--chip);color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
@media (max-width:380px){.logo img{height:34px}.appname{font-size:13px}}

/* Navigation */
.nav{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:8px 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid transparent}
.nav::-webkit-scrollbar{display:none}
.nav.stuck{border-bottom-color:var(--line)}
.nav a{flex:none;text-decoration:none;padding:8px 13px;border-radius:999px;background:var(--chip);font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:12px;padding:0 6px;min-width:19px;text-align:center;font-variant-numeric:tabular-nums}

.demo{margin-top:10px;background:var(--chip);border-left:4px solid var(--s5);border-radius:10px;padding:10px 12px;font-size:15px}
.demo b{font-weight:700}

/* Seitenkopf */
.intro{padding-block:18px 4px}
.eyerow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
.status{font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.status.warn{color:var(--accent)}
h1{margin:6px 0 0;font-family:var(--f-display);font-size:34px;line-height:1.02;font-weight:900;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.lead{color:var(--mute);margin:8px 0 0;max-width:60ch}
h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.sec{padding-top:26px}
.sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sechead .more{margin-left:auto;font-size:14px;font-weight:700;color:var(--mute);text-decoration:none}
.sechead .more:hover{color:var(--ink)}
.count{font-size:14px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}

/* Werkzeugleiste & Filter */
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:0 12px}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;outline:none;background:none;padding:10px 0;width:100%;font-size:16px}
.search svg{width:18px;height:18px;color:var(--mute);flex:none}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fchip{padding:6px 11px;border-radius:999px;background:var(--chip);font-weight:700;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fsel{padding:8px 10px;border-radius:10px;background:var(--chip);border:0;font-weight:600;font-size:14px;max-width:100%}
.btnsm{padding:8px 12px;border-radius:10px;background:var(--chip);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btnsm:hover{background:var(--line)}
.btnsm svg{width:16px;height:16px}
.btnsm.ink{background:var(--ink);color:var(--bg)}

/* Karten */
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;position:relative}
.card:hover{box-shadow:0 0 0 2px var(--line)}
.card .body{flex:1;min-width:0}
.card .t{font-weight:700;overflow-wrap:anywhere}
.card .d{color:var(--mute);font-size:15px;margin-top:2px;overflow-wrap:anywhere;white-space:pre-line}
.card .by{color:var(--mute);font-size:13px;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:12.5px;font-weight:700;color:var(--mute);background:var(--chip);border-radius:6px;padding:1px 7px;white-space:nowrap}
.tag.c{color:#fff;background:var(--tc)}
.tag.warn{color:var(--accent);background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
.tag.ok{color:var(--s3);background:transparent;box-shadow:inset 0 0 0 1.5px var(--s3)}
.datebox{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--chip);padding:5px 0 6px;line-height:1.05;border-top:4px solid var(--tc,var(--mute))}
.datebox b{display:block;font-family:var(--f-display);font-size:22px;font-weight:900}
.datebox span{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase}
.check{flex:none;width:26px;height:26px;border-radius:13px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.check:hover{border-color:var(--accent)}
.check svg{opacity:0;width:14px;height:14px}
.card.done .t{color:var(--done);text-decoration:line-through}
.card.done .check{background:var(--accent);border-color:var(--accent)}
.card.done .check svg{opacity:1}
.card .side{flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pin{box-shadow:inset 4px 0 0 var(--star)}
.empty{color:var(--mute);background:var(--card);border-radius:14px;padding:18px 16px;font-size:15px;border:2px dashed var(--line)}
.empty b{color:var(--ink)}
.month{font-family:var(--f-display);font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.month:first-child{margin-top:4px}

/* Übersicht */
.grid{display:grid;grid-template-columns:1fr;gap:6px 22px}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:var(--card);border-radius:14px;padding:12px;text-decoration:none;display:block}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:13px;font-weight:700;color:var(--mute)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}

/* Planung */
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1 0 auto;white-space:nowrap;padding:8px 10px;border-radius:8px;font-size:15px;font-weight:700;color:var(--mute);min-width:44px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.unit{background:var(--card);border-radius:14px;padding:12px 14px 12px 12px;display:flex;gap:12px;cursor:pointer}
.unit:hover{box-shadow:0 0 0 2px var(--line)}
.unit .nr{flex:none;width:34px;height:34px;border-radius:17px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:900}
.unit .gr{font-size:14px;margin-top:6px}
.unit .gr b{color:var(--s2)}

/* Notenrechner */
.calc{background:var(--card);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.calc .field input{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.result{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding-top:6px}
.result .note{font-family:var(--f-display);font-size:64px;font-weight:900;line-height:.9;color:var(--accent);min-width:64px;text-align:center}
.result .pct{color:var(--mute);font-weight:600}
table.keys{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
table.keys th,table.keys td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
table.keys th{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
table.keys tr:last-child td{border-bottom:0}
table.keys tr.hit td{background:var(--chip);font-weight:700}

/* Mitglieder */
.member{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 12px}
.avatar{flex:none;width:38px;height:38px;border-radius:19px;background:var(--chip);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:14px}
.member .body{flex:1;min-width:0}
.member .t{font-weight:700}
.member .d{font-size:13px;color:var(--mute)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;background:var(--card);border-radius:12px;margin-top:8px;width:100%;text-align:left;font-weight:600}
.setting small{display:block;font-weight:400;color:var(--mute);font-size:14px;margin-top:2px}
.setting .chev{color:var(--mute)}
.hint{background:var(--card);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--mute);margin-top:10px}
.hint b{color:var(--ink)}

/* Plus-Knopf */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;height:56px;padding:0 20px 0 16px;border-radius:28px;background:var(--accent);color:var(--accent-ink);font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.fab svg{width:22px;height:22px}

/* Fußzeile */
.foot{margin-top:56px;padding-block:20px 100px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.foot strong{color:var(--ink);font-weight:700}

/* Sheet & Formulare */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:640px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(calc(100% + 60px));visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;
  max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.sheet.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.shtitle{font-family:var(--f-display);font-size:22px;font-weight:900;text-transform:uppercase;margin:0 0 6px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-weight:700;font-size:15px}
.field input,.field textarea,.field select{padding:11px 13px;border:2px solid var(--line);border-radius:12px;background:var(--card);outline:none;font-size:17px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field small{color:var(--mute);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 13px;border-radius:10px;background:var(--chip);font-size:15px;font-weight:700;min-width:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cbx{display:flex;align-items:center;gap:10px;font-weight:600;padding:4px 0}
.cbx input{width:22px;height:22px;accent-color:var(--accent)}
.row{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:14px;border-radius:12px;font-weight:700;background:var(--chip);text-align:center;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.6}
.meta{font-size:13px;color:var(--mute);margin-top:4px}
.lmsg{min-height:1.2em;margin:0;font-weight:600;color:var(--accent)}
.prose{background:var(--card);border-radius:14px;padding:14px 16px;white-space:pre-line;overflow-wrap:anywhere}
.prose+.prose{margin-top:8px}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.blist li{background:var(--card);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.blist li span{flex:1}
.label{font-family:var(--f-display);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}

/* Anmeldung */
.login{max-width:420px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}
.lseg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.lseg button{flex:1;padding:10px 4px;border-radius:8px;font-weight:700;color:var(--mute)}
.lseg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.note-s{font-size:14px;color:var(--mute);margin:0}
.bigbtn{padding:14px;border-radius:12px;font-weight:800;background:var(--ink);color:var(--bg);font-size:17px;width:100%}
.bigbtn:disabled{opacity:.6}
.ghostbtn{padding:12px;border-radius:12px;font-weight:700;background:var(--chip);width:100%;text-align:center;text-decoration:none;display:block}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;z-index:80;transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{color:var(--accent);font-weight:800;margin-left:12px;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  body{background:#fff;color:#000;font-size:12pt}
  .nav,.fab,.headright,.tools,.fchips,.toast,.scrim,.demo,.noprint,.foot{display:none!important}
  .card,.unit,.prose,.blist li,table.keys{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  body.printsheet .wrap{display:none}
  body.printsheet .sheet{position:static;transform:none;visibility:visible;box-shadow:none;max-height:none;overflow:visible;max-width:none;padding:0}
  body.printsheet .grab,body.printsheet .row{display:none}
}
</style>
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">

<body>

  {k:'protokolle',l:'Protokolle',typ:'protokoll'},{k:'vereinbarungen',l:'Vereinbarungen',typ:'vereinbarung'},
  {k:'noten',l:'Notenrechner',typ:'einstellung'},{k:'fachschaft',l:'Fachschaft'}
];
const FAB={termin:'Termin',aufgabe:'Aufgabe',material:'Material',lektuere:'Lektüre',plan:'Einheit',protokoll:'Protokoll',vereinbarung:'Vereinbarung',einstellung:'Schlüssel',pinnwand:'Notiz'};

/* ---------- Zustand ---------- */
let CLOUD=null, USER=null, ME=null, ITEMS=[], MEMBERS=[], VIEW='uebersicht', SYNC='';
const UI=JSON.parse(lsGet(KEY+':ui')||'{}');
const saveUI=()=>lsSet(KEY+':ui',JSON.stringify(UI));
const of=typ=>ITEMS.filter(i=>i.typ===typ);
const byId=id=>ITEMS.find(i=>i.id===id);
const isLeitung=()=>ME&&ME.rolle==='leitung';

function setSync(s){SYNC=s;const el=$('#sync');if(!el)return;
  el.textContent={ok:'✓ aktuell',saving:'speichert …',offline:'offline',demo:'Demo',auth:'neu anmelden'}[s]||'';
  el.classList.toggle('warn',s==='offline'||s==='auth')}
function cacheKey(){return KEY+':cache:'+(USER?USER.id:'')}
function writeCache(){if(!DEMO&&USER)lsSet(cacheKey(),JSON.stringify({items:ITEMS,members:MEMBERS,me:ME,at:Date.now()}))}

/* ---------- Datenzugriff ---------- */
async function loadAll(silent){
  if(DEMO){return true}
  try{
    const [a,b]=await Promise.all([
      CLOUD.from('fs_eintraege').select('id,typ,data,created_name,updated_name,created_at,updated_at').eq('fachschaft',FS).order('updated_at',{ascending:false}),
      CLOUD.from('fs_mitglieder').select('user_id,name,rolle,joined_at').eq('fachschaft',FS).order('name')
    ]);
    if(a.error||b.error)throw (a.error||b.error);
    const sig=x=>x.length+'|'+(x[0]?x[0].updated_at:'')+'|'+x.map(i=>i.id).join('').length;
    const changed=sig(a.data)!==sig(ITEMS)||b.data.length!==MEMBERS.length;
    ITEMS=a.data;MEMBERS=b.data;ME=MEMBERS.find(m=>m.user_id===USER.id)||null;
    writeCache();setSync('ok');
    if(silent&&changed&&!sheetOpen())render();
    return true;
  }catch(e){setSync(/JWT|401/.test((e&&e.message)||'')?'auth':'offline');return false}
}
function fail(e){const m=(e&&e.message)||'';toast(/fetch|network|Failed/i.test(m)||navigator.onLine===false?'Offline – nicht gespeichert. Bitte später noch einmal.':'Fehler: '+m);setSync(navigator.onLine===false?'offline':SYNC)}
async function createItem(typ,data){
  if(DEMO){const now=new Date().toISOString();const it={id:uid(),typ,data,created_name:ME.name,updated_name:ME.name,created_at:now,updated_at:now};ITEMS.unshift(it);return it}
  setSync('saving');
  const {data:row,error}=await CLOUD.from('fs_eintraege').insert({fachschaft:FS,typ,data,created_by:USER.id}).select().single();
  if(error){fail(error);return null}
  ITEMS.unshift(row);writeCache();setSync('ok');return row;
}
async function updateItem(id,data){
  const it=byId(id);if(!it)return null;
  if(DEMO){it.data=data;it.updated_name=ME.name;it.updated_at=new Date().toISOString();return it}
  setSync('saving');
  const {data:row,error}=await CLOUD.from('fs_eintraege').update({data}).eq('id',id).select().single();
  if(error){fail(error);return null}
  Object.assign(it,row);writeCache();setSync('ok');return it;
}
async function deleteItem(id){
  if(DEMO){ITEMS=ITEMS.filter(i=>i.id!==id);return true}
  setSync('saving');
  const {error}=await CLOUD.from('fs_eintraege').delete().eq('id',id);
  if(error){fail(error);return false}
  ITEMS=ITEMS.filter(i=>i.id!==id);writeCache();setSync('ok');return true;
}

/* ---------- Sheet, Toast ---------- */
const sheet=$('#sheet'),scrim=$('#scrim');let sheetClose=null,sheetLocked=false;
const sheetOpen=()=>sheet.classList.contains('on');
function openSheet(html,onClose,locked){sheet.innerHTML='<div class="grab"></div>'+html;sheetClose=onClose||null;sheetLocked=!!locked;scrim.classList.add('on');sheet.classList.add('on');sheet.scrollTop=0}
function closeSheet(force){if(sheetLocked&&!force)return;sheet.classList.remove('on');scrim.classList.remove('on');document.body.classList.remove('printsheet');const f=sheetClose;sheetClose=null;sheetLocked=false;if(f)f()}
scrim.onclick=()=>closeSheet();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen())closeSheet()});
let tt=0;
function toast(msg,action,fn){const el=$('#toast');clearTimeout(tt);
  el.innerHTML=esc(msg)+(action?'<button>'+esc(action)+'</button>':'');
  if(action)el.querySelector('button').onclick=()=>{el.classList.remove('on');fn()};
  el.classList.add('on');tt=setTimeout(()=>el.classList.remove('on'),action?5000:2800)}

/* ---------- Formulare ---------- */
function fieldHTML(f,v){
  const id='f-'+f.k, val=v==null?(f.def!=null?f.def:''):v;
  const lab='<label for="'+id+'">'+esc(f.l)+(f.req?' *':'')+'</label>';
  const hint=f.hint?'<small>'+esc(f.hint)+'</small>':'';
  switch(f.t){
    case 'area':return '<div class="field">'+lab+'<textarea id="'+id+'" rows="'+(f.rows||4)+'" placeholder="'+esc(f.ph||'')+'">'+esc(val)+'</textarea>'+hint+'</div>';
    case 'lines':return '<div class="field">'+lab+'<textarea id="'+id+'" rows="5" placeholder="'+esc(f.ph||'')+'">'+esc(Array.isArray(val)?val.join('\n'):val)+'</textarea>'+hint+'</div>';
    case 'select':return '<div class="field">'+lab+'<select id="'+id+'"><option value="">– bitte wählen –</option>'+f.opts.map(o=>'<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>'+hint+'</div>';
    case 'seg':return '<div class="field"><span class="lab">'+esc(f.l)+(f.req?' *':'')+'</span><div class="seg" data-seg="'+f.k+'">'+f.opts.map(([k,l])=>'<button type="button" data-v="'+esc(k)+'" aria-pressed="'+(String(val)===k)+'">'+esc(l)+'</button>').join('')+'</div>'+hint+'</div>';
    case 'multi':{const a=Array.isArray(val)?val:[];return '<div class="field"><span class="lab">'+esc(f.l)+'</span><div class="chips" data-multi="'+f.k+'">'+f.opts.map(o=>'<button type="button" class="chip" data-v="'+esc(o)+'" aria-pressed="'+a.includes(o)+'">'+esc(o)+'</button>').join('')+'</div>'+hint+'</div>'}
    case 'check':return '<label class="cbx"><input type="checkbox" id="'+id+'"'+(val?' checked':'')+'>'+esc(f.l)+'</label>';
    case 'member':return '<div class="field">'+lab+'<input id="'+id+'" list="dl-members" value="'+esc(val)+'" autocomplete="off" placeholder="Name">'+hint+'</div>';
    default:{const type={date:'date',time:'time',number:'number',url:'url'}[f.t]||'text';
      return '<div class="field">'+lab+'<input id="'+id+'" type="'+type+'"'+(type==='number'?' inputmode="decimal" step="any"':'')+' value="'+esc(val)+'" placeholder="'+esc(f.ph||'')+'">'+hint+'</div>'}
  }
}
const flat=fs=>fs.flatMap(f=>f.g||[f]);
function formHTML(typ,data){
  const F=FORMS[typ];
  return F.f.map(f=>f.g?'<div class="two">'+f.g.map(x=>fieldHTML(x,data[x.k])).join('')+'</div>':fieldHTML(f,data[f.k])).join('')
   +'<datalist id="dl-members">'+MEMBERS.map(m=>'<option value="'+esc(m.name)+'">').join('')+'</datalist>';
}
function wireForm(){
  $$('#sheet [data-seg] button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $$('#sheet [data-multi] button').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'));
}
function readForm(typ,old){
  const d=Object.assign({},old||{});let miss=null;
  for(const f of flat(FORMS[typ].f)){
    let v;
    if(f.t==='seg'){const b=sheet.querySelector('[data-seg="'+f.k+'"] [aria-pressed="true"]');v=b?b.dataset.v:''}
    else if(f.t==='multi'){v=[...sheet.querySelectorAll('[data-multi="'+f.k+'"] [aria-pressed="true"]')].map(b=>b.dataset.v)}
    else if(f.t==='check'){v=$('#f-'+f.k).checked}
    else if(f.t==='lines'){v=$('#f-'+f.k).value.split('\n').map(s=>s.trim()).filter(Boolean)}
    else{v=$('#f-'+f.k).value.trim();
      if(f.t==='number'&&v!=='')v=Number(String(v).replace(',','.'));
      if(f.t==='url'&&v&&!/^[a-z]+:\/\//i.test(v))v='https://'+v}
    if(f.req&&(v===''||v==null||(Array.isArray(v)&&!v.length))&&!miss)miss=f.l;
    d[f.k]=v;
  }
  return {d,miss};
}
function byline(it){
  if(!it||!it.created_at)return '';
  let s='Angelegt von '+(it.created_name||'unbekannt')+' am '+fmtTS(it.created_at);
  if(it.updated_at&&it.updated_at!==it.created_at&&Math.abs(new Date(it.updated_at)-new Date(it.created_at))>60000)s+=' · zuletzt geändert von '+(it.updated_name||'unbekannt')+' am '+fmtTS(it.updated_at);
  return s;
}
function openForm(typ,id,preset){
  const it=id?byId(id):null,F=FORMS[typ];
  const data=Object.assign({},it?it.data:{},preset||{});
  openSheet('<h2 class="shtitle">'+esc(F.t)+(it?' bearbeiten':' anlegen')+'</h2>'
   +(typ==='protokoll'||typ==='material'||typ==='lektuere'?'<p class="note-s" style="margin-bottom:12px">Bitte keine Daten von Schülerinnen und Schülern eintragen.</p>':'')
   +'<form class="form" id="frm" novalidate>'+formHTML(typ,data)
   +'<p class="lmsg" id="fmsg" role="alert"></p>'
   +'<div class="row"><button type="button" class="btn" id="fx">Abbrechen</button><button class="btn primary" id="fok">Speichern</button></div>'
   +(it?'<div class="row"><button type="button" class="btn danger" id="fdel">Löschen</button></div><p class="meta">'+esc(byline(it))+'</p>':'')
   +'</form>');
  wireForm();
  const first=sheet.querySelector('input:not([type=checkbox]),textarea');if(first&&!it&&matchMedia('(pointer:fine)').matches)first.focus();
  $('#fx').onclick=()=>closeSheet();
  $('#frm').onsubmit=async e=>{e.preventDefault();
    const {d,miss}=readForm(typ,it?it.data:null);
    if(miss){$('#fmsg').textContent='Bitte „'+miss+'“ ausfüllen.';return}
    if(typ==='einstellung'){d.art='notenschluessel';const g=[d.g1,d.g2,d.g3,d.g4,d.g5];
      if(g.some(x=>!(x>=0&&x<=100))||g.some((x,i)=>i&&x>=g[i-1])){$('#fmsg').textContent='Die Grenzen müssen von Note 1 bis Note 5 kleiner werden (0–100 %).';return}}
    if(typ==='aufgabe'){if(d.erledigt&&!(it&&it.data.erledigt))d.erledigt_am=today();if(!d.erledigt)delete d.erledigt_am}
    $('#fok').disabled=true;
    const r=it?await updateItem(it.id,d):await createItem(typ,d);
    if(!r){$('#fok').disabled=false;return}
    closeSheet(true);render();toast(it?'Gespeichert':F.t+' angelegt');
  };
  if(it)$('#fdel').onclick=function(){
    if(this.dataset.sure){deleteItem(it.id).then(ok=>{if(ok){closeSheet(true);render();toast('Gelöscht')}});return}
    this.dataset.sure='1';this.textContent='Wirklich löschen? Nochmal tippen';
  };
}

const tags=(arr,cls)=>(arr||[]).map(x=>'<span class="tag'+(cls?' '+cls:'')+'">'+esc(x)+'</span>').join('');
const klTags=a=>a&&a.length?'<span class="tag">Kl. '+esc(a.join(', '))+'</span>':'';
const nivTags=a=>a&&a.length?'<span class="tag">'+esc(a.join('/'))+'</span>':'';
const empty=(txt)=>'<div class="empty">'+txt+'</div>';
function head(title,lead,eyebrow){
  return '<div class="intro"><div class="eyerow"><div class="eyebrow">'+esc(eyebrow||'Fachschaft Deutsch')+'</div><span class="status" id="sync"></span></div>'
   +'<h1>'+esc(title)+'</h1>'+(lead?'<p class="lead">'+lead+'</p>':'')+'</div>';

function searchBox(id,ph,val){return '<label class="search">'+ICON.search+'<input id="'+id+'" type="search" placeholder="'+esc(ph)+'" value="'+esc(val||'')+'" aria-label="'+esc(ph)+'"></label>'}
const match=(it,q)=>!q||JSON.stringify(it.data).toLowerCase().includes(q.toLowerCase());

function terminCard(it){
  const d=it.data,a=TERMART[d.art]||TERMART.sonst,dt=parse(d.datum),past=d.datum<today();
  return '<div class="card" data-open="'+it.id+'"'+(past?' style="opacity:.6"':'')+'><div class="datebox" style="--tc:'+a.c+'"><b>'+dt.getDate()+'</b><span>'+MONS[dt.getMonth()]+'</span></div>'
   +'<div class="body"><div class="t">'+esc(d.titel)+'</div><div class="d">'+esc(WD[dt.getDay()]+(d.zeit?', '+d.zeit+' Uhr':'')+(d.ort?' · '+d.ort:''))+'</div>'
   +'<div class="tags"><span class="tag c" style="--tc:'+a.c+'">'+esc(a.l)+'</span>'+klTags(d.klassen)+(past?'':'<span class="tag">'+rel(d.datum)+'</span>')+'</div>'
   +(d.notiz?'<div class="d">'+esc(d.notiz)+'</div>':'')+'</div></div>';
}
function aufgabeCard(it){
  const d=it.data,late=!d.erledigt&&d.faellig&&d.faellig<today();

   +'<div class="body"><div class="t">'+esc(d.titel)+'</div><div class="tags">'+(d.zustaendig?'<span class="tag">'+esc(d.zustaendig)+'</span>':'<span class="tag">noch offen, wer</span>')
   +(d.faellig?'<span class="tag'+(late?' warn':'')+'">bis '+fmtShort(d.faellig)+(late?' · überfällig':'')+'</span>':'')
   +(d.erledigt&&d.erledigt_am?'<span class="tag ok">erledigt '+fmtShort(d.erledigt_am)+'</span>':'')+'</div>'
   +(d.notiz?'<div class="d">'+esc(d.notiz)+'</div>':'')+'</div></div>';
}
function materialCard(it){

  return '<div class="card" data-open="'+it.id+'"><div class="body"><div class="t">'+esc(d.titel)+'</div>'
   +'<div class="tags">'+(d.art?'<span class="tag c" style="--tc:var(--s1)">'+esc(d.art)+'</span>':'')+klTags(d.klassen)+nivTags(d.niveau)+(d.bereich?'<span class="tag">'+esc(d.bereich)+'</span>':'')+'</div>'
   +(d.beschreibung?'<div class="d">'+esc(d.beschreibung)+'</div>':'')+'<div class="by">'+esc(it.created_name||'')+' · '+fmtTS(it.created_at)+'</div></div>'
   +(d.url?'<div class="side"><a class="btnsm ink" href="'+esc(d.url)+'" target="_blank" rel="noopener" data-stop>'+ICON.ext+'Öffnen</a></div>':'')+'</div>';
}
function lektuereCard(it){
  const d=it.data,a=d.ausleihe;
  return '<div class="card" data-open="'+it.id+'"><div class="body"><div class="t">'+esc(d.titel)+'</div>'+(d.autor?'<div class="d">'+esc(d.autor)+'</div>':'')
   +'<div class="tags">'+klTags(d.klassen)+nivTags(d.niveau)+(d.bestand?'<span class="tag">'+esc(d.bestand)+' Stück</span>':'')+(d.standort?'<span class="tag">'+esc(d.standort)+'</span>':'')
   +(a?'<span class="tag warn">ausgeliehen: '+esc(a.name)+(a.klasse?' ('+esc(a.klasse)+')':'')+(a.bis?' bis '+fmtShort(a.bis):'')+'</span>':'<span class="tag ok">verfügbar</span>')+'</div>'

}
function vereinbarungCard(it){
  const d=it.data;
  return '<div class="card" data-open="'+it.id+'"><div class="body"><div class="t">'+esc(d.titel)+'</div><div class="d">'+esc(d.text)+'</div>'

function pinCard(it){

const upcoming=()=>of('termin').filter(i=>i.data.datum>=today()).sort((a,b)=>(a.data.datum+(a.data.zeit||'')).localeCompare(b.data.datum+(b.data.zeit||'')));
const openTasks=()=>of('aufgabe').filter(i=>!i.data.erledigt).sort((a,b)=>(a.data.faellig||'9999').localeCompare(b.data.faellig||'9999'));
const mine=it=>ME&&it.data.zustaendig&&it.data.zustaendig.toLowerCase().includes(ME.name.toLowerCase().split(' ')[0]);

/* ---------- Ansichten ---------- */
const R={};
R.uebersicht=()=>{
  const up=upcoming(),ot=openTasks(),my=ot.filter(mine);
  const pins=of('pinnwand').sort((a,b)=>(b.data.wichtig?1:0)-(a.data.wichtig?1:0)||b.created_at.localeCompare(a.created_at)).slice(0,5);
  const mats=of('material').sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,4);
  const vs=of('vereinbarung').sort((a,b)=>(b.data.seit||'').localeCompare(a.data.seit||'')).slice(0,3);
  const h=new Date().getHours(),gr=h<11?'Guten Morgen':h<18?'Hallo':'Guten Abend';
  const fn=ME?ME.name.split(' ')[0]:'';
  return head(gr+(fn?', '+fn:''),'Was in der Fachschaft gerade ansteht.',fmtD(today()))
   +'<div class="stats"><a class="stat" href="#termine"><b>'+up.length+'</b><span>Termine</span></a><a class="stat" href="#aufgaben"><b>'+ot.length+'</b><span>offene Aufgaben</span></a>'
   +'<a class="stat" href="#material"><b>'+of('material').length+'</b><span>Materialien</span></a><a class="stat" href="#lektueren"><b>'+of('lektuere').length+'</b><span>Lektüren</span></a></div>'
   +'<div class="grid"><section class="sec"><div class="sechead"><h2>Nächste Termine</h2><a class="more" href="#termine">alle</a></div><div class="list">'+(up.slice(0,4).map(terminCard).join('')||empty('Keine Termine geplant.'))+'</div></section>'
   +'<section class="sec"><div class="sechead"><h2>Aufgaben</h2><span class="count">'+(my.length?my.length+' für dich':'')+'</span><a class="more" href="#aufgaben">alle</a></div><div class="list">'+((my.length?my:ot).slice(0,4).map(aufgabeCard).join('')||empty('Alles erledigt.'))+'</div></section>'
   +'<section class="sec"><div class="sechead"><h2>Pinnwand</h2><button class="more" data-new="pinnwand">+ Notiz</button></div><div class="list">'+(pins.map(pinCard).join('')||empty('Noch leer. Hier passen kurze Infos für alle hin.'))+'</div></section>'
   +'<section class="sec"><div class="sechead"><h2>Neu im Materialpool</h2><a class="more" href="#material">alle</a></div><div class="list">'+(mats.map(materialCard).join('')||empty('Noch kein Material geteilt.'))+'</div></section>'
   +'</div><section class="sec"><div class="sechead"><h2>Zuletzt vereinbart</h2><a class="more" href="#vereinbarungen">alle</a></div><div class="list">'+(vs.map(vereinbarungCard).join('')||empty('Noch keine Vereinbarungen.'))+'</div></section>';
};
R.termine=()=>{
  UI.tArt=UI.tArt||'';const past=!!UI.tPast;
  let l=of('termin').filter(i=>!UI.tArt||i.data.art===UI.tArt);
  l=past?l.filter(i=>i.data.datum<today()).sort((a,b)=>b.data.datum.localeCompare(a.data.datum)):l.filter(i=>i.data.datum>=today()).sort((a,b)=>(a.data.datum+(a.data.zeit||'')).localeCompare(b.data.datum+(b.data.zeit||'')));
  let html='',m='';
  l.forEach(it=>{const d=parse(it.data.datum),mm=MON[d.getMonth()]+' '+d.getFullYear();if(mm!==m){m=mm;html+='<div class="month">'+mm+'</div>'}html+=terminCard(it)});
  return head('Termine & Fristen','Sitzungen, Prüfungen, Abgaben – für alle sichtbar. Mit „Kalender“ holst du alle kommenden Termine in deinen eigenen Kalender.')

const half=x=>Math.ceil(x*2-1e-9)/2;
const nf=x=>String(x).replace('.',',');
R.noten=()=>{
  const ks=keys();let k=ks.find(x=>x.id===UI.nk)||ks[0];
  const max=Number(UI.nmax)||40,p=UI.np===''||UI.np==null?'':Number(UI.np);
  const ab=k.grenzen.map(g=>half(max*g/100));
  let note='–',pct='';
  if(p!==''&&!isNaN(p)&&max>0){const pc=p/max*100;pct=nf(Math.round(pc*10)/10)+' %';note=6;for(let i=0;i<5;i++){if(p>=ab[i]){note=i+1;break}}}
  const rows=[1,2,3,4,5,6].map(n=>{const from=n<6?ab[n-1]:0,to=n===1?max:ab[n-2]-0.5;return '<tr'+(note===n?' class="hit"':'')+'><td><b>'+n+'</b></td><td>'+nf(from)+' – '+nf(Math.max(from,to))+'</td><td>'+(n<6?'ab '+k.grenzen[n-1]+' %':'darunter')+'</td></tr>'}).join('');
  return head('Notenrechner','Punkte eingeben, Note ablesen – mit dem Notenschlüssel der Fachschaft. Punkte werden auf halbe Punkte aufgerundet.')
   +'<div class="tools"><select class="fsel" id="nk" aria-label="Notenschlüssel">'+ks.map(x=>'<option value="'+esc(x.id)+'"'+(x===k?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>'
   +(k.id?'<button class="btnsm" data-open="'+k.id+'">Schlüssel bearbeiten</button>':'')+'<button class="btnsm" data-new="einstellung">+ Neuer Schlüssel</button></div>'
   +'<div class="calc" style="margin-top:14px"><div class="field"><label for="nmax">Höchstpunktzahl</label><input id="nmax" type="number" inputmode="decimal" min="1" step="0.5" value="'+esc(max)+'"></div>'
   +'<div class="field"><label for="np">Erreichte Punkte</label><input id="np" type="number" inputmode="decimal" min="0" step="0.5" value="'+esc(p)+'" placeholder="z. B. 31,5"></div>'
   +'<div class="result"><div class="note" id="nres"'+(note==='–'?' style="color:var(--line)"':'')+'>'+note+'</div><div><div style="font-weight:700">'+(note==='–'?'Punkte eingeben':'Note '+note)+'</div><div class="pct">'+(pct||'&nbsp;')+'</div></div></div></div>'
   +'<section class="sec" style="padding-top:18px"><div class="sechead"><h2>Punkteverteilung</h2><span class="count">bei '+nf(max)+' Punkten</span></div>'
   +'<table class="keys"><thead><tr><th>Note</th><th>Punkte</th><th>Grenze</th></tr></thead><tbody>'+rows+'</tbody></table></section>'
   +(k.id?'':'<div class="hint">Das ist ein <b>Beispielschlüssel</b>. Legt mit „+ Neuer Schlüssel“ euren eigenen an – er gilt dann für alle in der Fachschaft.</div>');
};

function nav(){

}
function render(){
  const v=VIEWS.find(x=>x.k===VIEW)||VIEWS[0];
  const y=window.scrollY;
  $('#main').innerHTML=R[v.k]();
  setSync(SYNC);nav();
  const ft=v.typ||'termin';
  $('#fab').hidden=v.k==='fachschaft';
  $('#fabTxt').textContent=FAB[ft];$('#fab').dataset.typ=ft;
  if(render.keep)window.scrollTo(0,y);render.keep=false;

function go(k){if(!R[k])k='uebersicht';if(k!==VIEW){VIEW=k;window.scrollTo(0,0)}render()}
window.addEventListener('hashchange',()=>{if(USER||DEMO){closeSheet(true);go(location.hash.slice(1))}});
$('#fab').onclick=()=>{const t=$('#fab').dataset.typ;openForm(t,null,t==='plan'?{klasse:UI.pkl||'5'}:t==='aufgabe'?{zustaendig:ME?ME.name:''}:t==='protokoll'?{datum:today(),protokollant:ME?ME.name:''}:null)};
const rer=()=>{render.keep=true;render()};
function bindInput(id,set){const el=$('#'+id);if(!el)return;el.oninput=()=>{set(el.value);saveUI();const pos=el.selectionStart;render.keep=true;render();const n=$('#'+id);n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
function bindView(){
  const m=$('#main');
  m.onclick=async e=>{
    const t=e.target.closest('button,a,[data-open],[data-proto]');if(!t)return;
    if(t.hasAttribute('data-stop'))return;
    const ds=t.dataset;
    if(ds.toggle){e.stopPropagation();const it=byId(ds.toggle);const d=Object.assign({},it.data,{erledigt:!it.data.erledigt});if(d.erledigt)d.erledigt_am=today();else delete d.erledigt_am;
      if(await updateItem(it.id,d)){rer();if(d.erledigt)toast('Erledigt','Rückgängig',async()=>{const x=Object.assign({},it.data,{erledigt:false});delete x.erledigt_am;await updateItem(it.id,x);rer()})}return}
    if(ds.lend){e.stopPropagation();lend(ds.lend);return}
    if(ds.open){openForm(byId(ds.open).typ,ds.open);return}
    if(ds.proto){openProto(ds.proto);return}
    if(ds.new){openForm(ds.new);return}
    if(ds.tpast!=null){UI.tPast=ds.tpast==='1';saveUI();rer();return}
    if(ds.tart!=null){UI.tArt=ds.tart;saveUI();rer();return}
    if(ds.amine!=null){UI.aMine=ds.amine==='1';saveUI();rer();return}
    if(t.hasAttribute('data-aall')){UI.aAll=true;rer();return}
    if(ds.mkl!=null){UI.mf.kl=ds.mkl;saveUI();rer();return}
    if(ds.mniv!=null){UI.mf.niv=ds.mniv;saveUI();rer();return}
    if(ds.lkl!=null){UI.lkl=ds.lkl;saveUI();rer();return}
    if(ds.pkl){UI.pkl=ds.pkl;saveUI();rer();return}
    if(ds.ics){downloadICS();return}
    if(t.hasAttribute('data-print')){window.print();return}
    if(ds.mem){manageMember(ds.mem);return}
    if(ds.act){settingsAct(ds.act);return}
  };
  $$('[data-mf]').forEach(s=>s.onchange=()=>{UI.mf[s.dataset.mf]=s.value;saveUI();rer()});
  bindInput('mq',v=>UI.mf.q=v);bindInput('lq',v=>UI.lq=v);bindInput('pq',v=>UI.pq=v);bindInput('vq',v=>UI.vq=v);
  const nk=$('#nk');if(nk)nk.onchange=()=>{UI.nk=nk.value;saveUI();rer()};
  ['nmax','np'].forEach(id=>{const el=$('#'+id);if(el)el.oninput=()=>{UI[id]=el.value.replace(',','.');saveUI();const pos=el.selectionStart;render.keep=true;render();const n=$('#'+id);n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}});
}

  openSheet('<h2 class="shtitle">Ausleihen</h2><p class="note-s" style="margin-bottom:12px">'+esc(d.titel)+'</p><form class="form" id="lf" novalidate>'
   +'<div class="field"><label for="l-n">Wer?</label><input id="l-n" list="dl-m2" value="'+esc(ME?ME.name:'')+'"><datalist id="dl-m2">'+MEMBERS.map(m=>'<option value="'+esc(m.name)+'">').join('')+'</datalist></div>'
   +'<div class="two"><div class="field"><label for="l-k">Für Klasse</label><input id="l-k" placeholder="z. B. 7b"></div><div class="field"><label for="l-b">Bis</label><input id="l-b" type="date"></div></div>'
   +'<div class="row"><button type="button" class="btn" id="lx">Abbrechen</button><button class="btn primary">Ausleihen</button></div></form>');
  $('#lx').onclick=()=>closeSheet();

    const x=Object.assign({},d,{ausleihe:{name:n,klasse:$('#l-k').value.trim(),bis:$('#l-b').value,am:today()}});
    if(await updateItem(id,x)){closeSheet(true);rer();toast('Als ausgeliehen eingetragen')}};

function downloadICS(){
  const up=upcoming();if(!up.length){toast('Keine kommenden Termine');return}
  const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
  const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PAGS Kuelsheim//Fachschaft Deutsch//DE','CALSCALE:GREGORIAN','X-WR-CALNAME:Fachschaft Deutsch PAGS'];
  up.forEach(it=>{const d=it.data,k=d.datum.replace(/-/g,'');L.push('BEGIN:VEVENT','UID:'+it.id+'@fachschaft-deutsch.pags','DTSTAMP:'+st);
    if(d.zeit){const [h,m]=d.zeit.split(':').map(Number),end=new Date(2000,0,1,h,m+90);L.push('DTSTART;TZID=Europe/Berlin:'+k+'T'+pad(h)+pad(m)+'00','DTEND;TZID=Europe/Berlin:'+k+'T'+pad(end.getHours())+pad(end.getMinutes())+'00')}
    else L.push('DTSTART;VALUE=DATE:'+k,'DTEND;VALUE=DATE:'+addDays(d.datum,1).replace(/-/g,''));

  L.push('END:VCALENDAR');
  save('fachschaft-deutsch-termine.ics',L.join('\r\n'),'text/calendar');toast(up.length+' Termine exportiert');
}

const toLogin=u=>u+'@'+LOGIN_DOMAIN;
const USER_RE=/^[a-z0-9][a-z0-9._-]{2,29}$/;
function authMsg(e){const m=(e&&e.message)||'';
  if(/Invalid login credentials/i.test(m))return 'Benutzername oder Passwort stimmt nicht.';
  if(/already registered|already exists/i.test(m))return 'Diesen Benutzernamen gibt es schon. Wähle bitte einen anderen.';
  if(/Password should be|weak/i.test(m))return 'Das Passwort ist zu kurz oder zu einfach.';
  if(/Signups not allowed|signup.*disabled/i.test(m))return 'Neue Konten können gerade nicht angelegt werden.';
  if(/rate limit|too many/i.test(m))return 'Zu viele Versuche. Warte kurz und probier es noch einmal.';
  if(/fetch|network|Failed/i.test(m))return 'Keine Verbindung zum Server. Bist du online?';
  return m||'Unbekannter Fehler.'}
function showView(login){$('#loginView').hidden=!login;$('#main').hidden=login;$('#nav').hidden=login;$('#btnSearch').hidden=login;$('#fab').hidden=true}
function showLogin(msg,mode){
  mode=mode||'in';showView(true);
  $('#loginView').innerHTML='<div class="login">'
   +'<h1>Fachschaft Deutsch</h1><p class="lead" style="margin:0">Termine, Material, Lektüren, Protokolle und Absprachen der Deutsch-Fachschaft an einem Ort. Melde dich mit deinem Konto vom PAGS Lernplaner an oder leg hier eins an.</p>'
   +'<div class="lseg" role="group" aria-label="Anmelden oder registrieren"><button data-lmode="in" aria-pressed="'+(mode==='in')+'">Anmelden</button><button data-lmode="up" aria-pressed="'+(mode==='up')+'">Neues Konto</button></div>'
   +'<form id="loginForm" class="form" novalidate>'
   +'<div class="field"><label for="lg-user">Benutzername</label><input id="lg-user" autocomplete="username" autocapitalize="none" spellcheck="false"'+(mode==='up'?' placeholder="z. B. dein Kürzel"':'')+'></div>'
   +'<div class="field"><label for="lg-pass">Passwort</label><input id="lg-pass" type="password" autocomplete="'+(mode==='up'?'new-password':'current-password')+'"></div>'
   +(mode==='up'?'<div class="field"><label for="lg-pass2">Passwort wiederholen</label><input id="lg-pass2" type="password" autocomplete="new-password"></div>'
     +'<p class="note-s">Benutzername: 3–30 Zeichen, nur Kleinbuchstaben, Ziffern, Punkt, Bindestrich – am besten dein Kürzel. Passwort: mindestens 8 Zeichen. Merk es dir gut, es gibt keine E-Mail zum Zurücksetzen.</p>':'')
   +'<p class="lmsg" id="lg-msg" role="alert">'+(msg?esc(msg):'')+'</p>'
   +'<button class="bigbtn" id="lg-go">'+(mode==='up'?'Konto anlegen':'Anmelden')+'</button></form>'
   +'<a class="ghostbtn" href="?demo">Erst einmal ansehen: Demo ohne Anmeldung</a>'
   +'<p class="note-s" style="text-align:center">Passwort vergessen? Wende dich an Thorsten von Plotho-Kettner.</p></div>';
  $$('[data-lmode]').forEach(b=>b.onclick=()=>showLogin('',b.dataset.lmode));
  const say=t=>{$('#lg-msg').textContent=t};
  $('#loginForm').onsubmit=async e=>{e.preventDefault();
    const u=$('#lg-user').value.trim().toLowerCase(),pw=$('#lg-pass').value;
    if(!USER_RE.test(u)){say('Der Benutzername passt nicht: 3–30 Zeichen, nur a–z, 0–9, Punkt und Bindestrich.');return}
    if(pw.length<8){say('Das Passwort braucht mindestens 8 Zeichen.');return}
    const btn=$('#lg-go');btn.disabled=true;say(mode==='up'?'Konto wird angelegt …':'Anmeldung läuft …');
    let res;
    try{
      if(mode==='up'){
        if(pw!==$('#lg-pass2').value){btn.disabled=false;say('Die Passwörter sind nicht gleich.');return}
        res=await CLOUD.auth.signUp({email:toLogin(u),password:pw,options:{data:{username:u}}});
        if(!res.error&&!res.data.session){btn.disabled=false;say('Konto angelegt, aber noch nicht freigeschaltet. Bitte Thorsten von Plotho-Kettner Bescheid sagen.');return}
      }else res=await CLOUD.auth.signInWithPassword({email:toLogin(u),password:pw});
    }catch(err){res={error:err}}
    if(res.error){btn.disabled=false;say(authMsg(res.error));return}
    await startUser(res.data.user);
  };
}

/* ---------- Start ---------- */
async function boot(){
  applyTheme();
  window.addEventListener('scroll',()=>$('#nav').classList.toggle('stuck',window.scrollY>60),{passive:true});
  if(DEMO){demoData();$('#demoBanner').hidden=false;$('#demoBanner').innerHTML='<div class="demo"><b>Demo:</b> So sieht die App mit Beispielinhalten aus. Änderungen werden nicht gespeichert. <a href="./">Zur Anmeldung</a></div>';SYNC='demo';startApp();return}
  const configured=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey);
  if(configured&&window.supabase){
    CLOUD=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'pags-lernplaner-auth'}});
    let session=null;try{session=(await CLOUD.auth.getSession()).data.session}catch(e){}
    if(session){await startUser(session.user);return}
    showLogin();return;
  }
  let last=null;try{last=JSON.parse(lsGet(KEY+':last'))}catch(e){}
  if(last){USER=last;await enter();return}
  showView(true);$('#loginView').innerHTML='<div class="login"><h1>Keine Verbindung</h1><p class="lead" style="margin:0">Für die Anmeldung brauchst du Internet.</p><a class="ghostbtn" href="?demo">Demo ansehen</a></div>';
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&USER&&ME&&!DEMO)loadAll(true)});
setInterval(()=>{if(!document.hidden&&USER&&ME&&!DEMO&&!sheetOpen())loadAll(true)},60000);
window.addEventListener('online',()=>{if(USER&&ME&&!DEMO)loadAll(true)});
boot();
})();
</script>
